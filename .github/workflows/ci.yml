name: CI

# Runs on every pull request, which `test.yml` cannot: it rebuilds the native module from source
# across six OS/Node combinations, and a Skia build is far too slow to gate a review on.
#
# This fetches the prebuilt binary for the release instead, so a change is verified on Linux,
# macOS and Windows in about a minute each — the same rendering suite, against the same artifact
# users install. test.yml stays available for release-time verification that the module still
# builds from source.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.label }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than crossed, because the two axes are not independent: Node version
        # is what varies on Linux, operating system is what varies everywhere else.
        #
        # Node 22 is the floor from `engines` and 24 the current active LTS; Node 20 reached
        # end-of-life on 2026-04-30, so testing it would only prove an unsupported runtime still
        # happens to work.
        #
        # macOS and Windows run one Node version each. What breaks per-platform in a native addon
        # is the binary and the loader, not the JavaScript, so a second Node version there costs a
        # job and finds nothing a Linux job would miss. Before this, the only automatic coverage
        # was Linux — Windows was tested solely when someone remembered to dispatch test.yml.
        include:
          - { os: ubuntu-latest, label: linux, node: 22 }
          - { os: ubuntu-latest, label: linux, node: 24 }
          - { os: macos-latest, label: macos, node: 24 }
          - { os: windows-latest, label: windows, node: 24 }

    # Windows runners default to PowerShell, where `if node ...; then` and `>> "$GITHUB_OUTPUT"`
    # are syntax errors. Git Bash ships on every runner image, so one setting keeps the steps
    # below identical across all three platforms.
    defaults:
      run:
        shell: bash

    steps:
      # Some LFS fixtures sit deeper than Windows' default 260-character path limit.
      - name: Enable long paths (Windows only)
        if: ${{ runner.os == 'Windows' }}
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The image and font fixtures are stored in LFS. Without this they check out as pointer
          # text, and every test that decodes one fails with "Could not decode image data" — around
          # two dozen of them, for a reason that looks nothing like the real cause.
          lfs: true
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts so the install step does not race the explicit fetch below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Needs no native binary, so it runs before the download and reports separately from a
      # rendering failure. Checked on every leg rather than once because the config pins
      # endOfLine, and Windows is the only runner that can catch a CRLF slipping in.
      - name: Check formatting
        run: npm run format:check

      # The declaration files are what the package ships as its `types`, and until this
      # existed nothing checked them -- `just typecheck` was Rust-only. Runs with
      # `skipLibCheck` off, which is how a consumer who disables it sees the package.
      # Needs no native binary, so it sits with the other pre-download checks.
      - name: Type-check the shipped declarations
        run: npm run typecheck

      # Download only, never `--or-compile`. Building Skia from source takes roughly an hour and
      # needs a toolchain this job deliberately does not install, so a compile fallback would turn
      # every pull request into an hour-long job rather than the minute this is meant to take.
      #
      # A missing asset is expected until the first release is published, and the suite below is
      # split so that gap does not silently become a pass.
      - name: Fetch the native binary
        id: binary
        run: |
          if node lib/prebuild.mjs download; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No published asset for v$(node -p "require('./package.json').version")."
          fi

      # tests/static holds the suites that analyse files rather than exercise the binary, so they
      # are real signal even before the first release — and they are the only coverage the install
      # path has, which is where follow-redirects, https-proxy-agent and detect-libc are used.
      # Naming the directory rather than the files means a new static suite needs no edit here.
      - name: Test the packaging, install path and declarations
        run: npm run test:static

      # Was the binary fetched above built from this commit's source? This job asks "does what
      # users install work?", which is unanswerable once main moves past the published tag — and
      # answering it with a failure is what put every push after the first `src` change of a
      # cycle into the red, about 130 of them before v5.0.0, whatever the push touched.
      #
      # Compares `src` and `build.rs` only. `Cargo.toml` changes when a release bumps the version
      # without altering a byte of rendered output, so including it would mark the tree stale
      # after every release; `Cargo.lock` is untracked and cannot be compared at all. Dependency
      # drift with no `src` change therefore slips past this, which is what test.yml's weekly
      # from-source run exists to catch.
      #
      # One tag, fetched shallow. `fetch-depth: 0` on the checkout would pull the whole history
      # and its LFS objects to answer a question about two paths.
      - name: Is the published binary built from this source?
        id: freshness
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! git fetch --depth=1 --no-tags origin \
                 "refs/tags/v${VERSION}:refs/tags/v${VERSION}" 2>/dev/null; then
            echo "current=unknown" >> "$GITHUB_OUTPUT"
            echo "no tag v${VERSION} to compare against; treating the binary as current"
            exit 0
          fi

          moved=""
          for path in src build.rs; do
            if [ "$(git rev-parse "HEAD:${path}")" != "$(git rev-parse "v${VERSION}:${path}")" ]; then
              moved="${moved}${path} "
            fi
          done

          if [ -n "$moved" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "changed since v${VERSION}: ${moved}"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "source matches v${VERSION}"
          fi

      # Everything that actually renders. Reported as failed when no binary could be fetched: a run
      # that could not execute these has not verified them, and a green check saying otherwise is
      # worse than a red one.
      #
      # Pinned to the binary the step above fetched. `npm ci` installs the optional platform
      # packages too, and those win over lib/skia.node during resolution — so without this the
      # suite would exercise a binary this job never checked, and the fetch step's success or
      # failure would have no bearing on what actually ran.
      - name: Test rendering
        if: steps.binary.outputs.available == 'true' && steps.freshness.outputs.current != 'false'
        env:
          MEO_SKIA_CANVAS_BINARY: ${{ github.workspace }}/lib/skia.node
        run: npm test

      # Not a failure. The published binary predates this commit, so it cannot answer for it
      # either way, and a red check here would mean nothing a reader could act on. The engine is
      # still covered from source by rust-ci.yml on the same push; what goes uncovered until the
      # next release is the JavaScript binding against the new Rust.
      - name: Rendering tests skipped (source has moved)
        if: steps.binary.outputs.available == 'true' && steps.freshness.outputs.current == 'false'
        run: |
          echo "::notice::src or build.rs has changed since v$(node -p "require('./package.json').version"), so the published binary cannot verify this commit and the rendering suite did not run. rust-ci.yml covers the engine from source; the binding is verified at release by test.yml."

      - name: Rendering tests did not run
        if: steps.binary.outputs.available != 'true'
        run: |
          echo "::error::No binary for v$(node -p "require('./package.json').version"), so the rendering suite did not run. This clears once the release carries its assets."
          exit 1
