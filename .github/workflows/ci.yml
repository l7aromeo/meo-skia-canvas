name: CI

# Runs on every pull request, which `test.yml` cannot: it rebuilds the native module from source
# across six OS/Node combinations, and a Skia build is far too slow to gate a review on.
#
# This fetches the prebuilt binary for the release instead, so a pure-JavaScript change is verified
# in about a minute. `--or-compile` covers the bootstrap case where no release exists yet, and the
# full matrix in test.yml stays available for release-time verification.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          # The image and font fixtures are stored in LFS. Without this they check out as pointer
          # text, and every test that decodes one fails with "Could not decode image data" — around
          # two dozen of them, for a reason that looks nothing like the real cause.
          lfs: true
          submodules: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts so the install step does not race the explicit fetch below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Download only, never `--or-compile`. Building Skia from source takes roughly an hour and
      # needs a toolchain this job deliberately does not install, so a compile fallback would turn
      # every pull request into an hour-long job rather than the minute this is meant to take.
      #
      # A missing asset is expected before the first release, so the failure is swallowed here
      # rather than with `continue-on-error`. That keeps the job green but still records the step
      # as failed, which surfaces as an error annotation on an otherwise passing run.
      - name: Fetch the native binary
        run: node lib/prebuild.mjs download || echo "No published asset for this version; continuing without a native binary."

      - name: Run tests
        run: |
          if [ -f lib/skia.node ]; then
            npm test
          else
            version=$(node -p "require('./package.json').version")
            echo "::warning::No published binary for v${version}; running only the tests that do not need one."
            node --test tests/suite/binary.test.js
          fi
