name: Publish to crates.io

# A dry run and a real publish otherwise look identical in the Actions list, and the step that runs
# `cargo publish --dry-run` still reports "Publish: success" — which reads like the crate went out.
# Say so in the run title instead of leaving it to be inferred.
run-name: >-
  ${{ inputs.dry_run && 'crates.io — DRY RUN (nothing is published)'
  || format('crates.io — publish {0}', github.ref_name) }}

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only — do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  # Required to mint the OIDC token that crates.io exchanges for a short-lived publish token.
  id-token: write

jobs:
  publish:
    name: Publish meo-skia-canvas to crates.io
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The contract test decodes tests/assets/pentagon.png and registers the Oswald variable
          # font. Both are LFS-tracked, so without this they arrive as pointer text and the test
          # fails with "skia could not decode the encoded image bytes", which reads like a Skia
          # fault rather than a missing fixture.
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            nasm \
            pkg-config

      - name: Verify Cargo.toml metadata
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Package (no verification, surfaces include-list issues)
        run: cargo package --no-verify --list

      - name: Build with feature subset that crates.io will use
        run: cargo build --no-default-features --features "vulkan,window,freetype"

      - name: Run the native test suite
        run: cargo test --no-default-features --features "vulkan,window,freetype"

      # No stored credential: crates.io trades the workflow's OIDC token for one that lasts the job
      # and is revoked in this action's post step. Needs a Trusted Publisher registered for the
      # crate on crates.io, pointing at this repository, this workflow file and the Production
      # environment.
      # Whether this run will actually publish. Kept as one expression so the auth step and the
      # publish step cannot disagree about it.
      # A tag push carries no inputs, so `inputs.dry_run` is false there and the run publishes.
      - name: Decide whether this run publishes
        id: mode
        run: echo "publish=${{ !inputs.dry_run }}" >> "$GITHUB_OUTPUT"

      # Skipped for a dry run: `cargo publish --dry-run` contacts no registry, and requiring a
      # credential for it would make the safe path unusable until a Trusted Publisher exists —
      # which is exactly when validating the release is most useful.
      - name: Authenticate with crates.io
        id: auth
        if: steps.mode.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Split rather than branched inside one step, so the step list itself distinguishes the two.
      # A single "Publish: success" cannot tell you which one happened.
      - name: Publish to crates.io
        if: steps.mode.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-default-features --features "vulkan,window,freetype"

      - name: Dry run only — nothing is published
        if: steps.mode.outputs.publish != 'true'
        run: cargo publish --no-default-features --features "vulkan,window,freetype" --dry-run
