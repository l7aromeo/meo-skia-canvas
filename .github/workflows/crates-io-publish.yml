name: Publish to crates.io

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only"
        required: false
        default: "false"

permissions:
  contents: read
  # Required to mint the OIDC token that crates.io exchanges for a short-lived publish token.
  id-token: write

jobs:
  publish:
    name: Publish meo-skia-canvas to crates.io
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            pkg-config

      - name: Verify Cargo.toml metadata
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Package (no verification, surfaces include-list issues)
        run: cargo package --no-verify --list

      - name: Build with feature subset that crates.io will use
        run: cargo build --no-default-features --features "vulkan,window,freetype"

      - name: Run native API contract test
        run: cargo test --no-default-features --features "vulkan,window,freetype" --test native_api_contract

      # No stored credential: crates.io trades the workflow's OIDC token for one that lasts the job
      # and is revoked in this action's post step. Needs a Trusted Publisher registered for the
      # crate on crates.io, pointing at this repository, this workflow file and the Production
      # environment.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish (dry-run on workflow_dispatch unless dry_run=false, real on tag)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            cargo publish --no-default-features --features "vulkan,window,freetype" --dry-run
          else
            cargo publish --no-default-features --features "vulkan,window,freetype"
          fi
