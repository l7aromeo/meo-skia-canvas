name: Publish to NPM

# A dry run and a real publish otherwise look identical in the Actions list. Say which one this is.
run-name: >-
  ${{ inputs.dry_run && 'npm — DRY RUN (nothing is published)' || 'npm — publish' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate only — do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # Tells npm which registry to mint an OIDC credential for.
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The npm bundled with Node LTS can predate OIDC support, in which case
      # publishing falls back to looking for a token and fails.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest

      - name: Add hashes to package.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          node lib/prebuild.mjs snapshot
          npm pkg get prebuild

      # The platform packages must already be on the registry: this package pins every one of
      # them in `optionalDependencies` at an exact version, so publishing first would point the
      # main package at versions that do not exist. That ordering was previously held only by
      # the order `just publish-npm` dispatches the two workflows in, which an Actions-tab
      # dispatch of this one bypasses without saying anything.
      #
      # What is checked is `optionalDependencies`, because that is what this package will
      # actually declare -- but how many there should be comes from `lib/targets.json`, the same
      # source `snapshot` counts against for the same reason. Reading only the manifest makes
      # the check vacuous exactly when it matters: a release tag carries `optionalDependencies`
      # empty, since `release-npm` strips it before tagging and `sync-targets` restores it
      # after, so a dispatch at a tag ref iterated nothing and reported success. That is the
      # Actions-tab dispatch this guard exists to catch.
      #
      # Three faults, three messages, because they want different answers. An empty target list
      # means the thing this counts against is itself missing, and comparing two counts cannot
      # see it: zero equals zero, so the check would pass having verified nothing. Pins absent
      # means the tree is not in the state a publish runs from. Both are wrong in a rehearsal
      # too. Only the third -- a pinned package not yet on the registry -- is the ordering
      # fault, and there a dry run reports rather than fails, because rehearsing before the
      # platform packages exist is the normal case and a guard that made the rehearsal
      # impossible would be run once.
      #
      # The empty-source check is not hypothetical bookkeeping. `sync-targets` writes
      # `optionalDependencies` from this same file and `lib/binary.js` derives
      # `PLATFORM_PACKAGES` from it, so a bad write there produces a tree where the pins are
      # wrong and this guard is the thing that should say so.
      - name: The platform packages this pins must exist
        run: |
          # Sets rather than counts. Two counts agree while naming different things, and that
          # is the state a rename produces: edit a triplet in `lib/targets.json` without
          # re-running `sync-targets` and both sides still hold seven entries, so a count
          # check passes, the registry loop asks about the stale seven -- which exist -- and
          # the publish proceeds. What ships is a package whose `optionalDependencies` name
          # packages that `lib/binary.js`, in the same tarball, will never look for, and every
          # consumer on the renamed platform falls silently through to the download path.
          #
          # Derived through `packageName` out of `lib/binary.js`, which is the one definition
          # of the naming rule: `scripts/platform-package.mjs` imports it rather than
          # restating it, so the loader, `sync-targets` and this check cannot disagree about
          # what a target is called.
          node - <<'JS' > /tmp/pins.txt
          const { TARGETS, packageName } = require("./lib/binary.js");
          const pkg = require("./package.json");
          const triplets = Object.keys(TARGETS);
          const fail = (msg) => { console.error(`::error::${msg}`); process.exit(1); };

          if (triplets.length === 0)
            fail("lib/targets.json lists no platform targets, so there is nothing to check the pins against. That file is the single source for the target list, so an empty one is a broken tree rather than a release with no platforms.");

          const want = new Map(triplets.map((t) => [packageName(t), pkg.version]));
          const have = new Map(Object.entries(pkg.optionalDependencies || {}));

          const missing = [...want.keys()].filter((n) => !have.has(n));
          const extra = [...have.keys()].filter((n) => !want.has(n));
          const wrong = [...want].filter(([n, v]) => have.has(n) && have.get(n) !== v)
            .map(([n, v]) => `${n} pinned at "${have.get(n)}", expected "${v}"`);

          if (missing.length || extra.length || wrong.length) {
            if (missing.length) console.error(`::error::in lib/targets.json but not pinned: ${missing.join(", ")}`);
            if (extra.length) console.error(`::error::pinned but not in lib/targets.json: ${extra.join(", ")}`);
            for (const w of wrong) console.error(`::error::${w}`);
            fail("package.json's optionalDependencies do not match lib/targets.json. Run \"npm run sync-targets\" and dispatch against a ref where it has run -- a release tag carries none of these, because release-npm strips them before tagging and sync-targets restores them after.");
          }
          for (const [name, version] of want) console.log(`${name} ${version}`);
          JS
          EXPECTED=$(grep -c . /tmp/pins.txt)
          MISSING=0
          while read -r NAME VERSION; do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "  ok       $NAME@$VERSION"
            else
              echo "  MISSING  $NAME@$VERSION"
              MISSING=$((MISSING + 1))
            fi
          done < /tmp/pins.txt
          if [ "$MISSING" -eq 0 ]; then
            echo "all $EXPECTED pinned platform packages are published"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::warning::$MISSING of $EXPECTED platform package(s) not published yet -- a real run would refuse here"
          else
            echo "::error::$MISSING of $EXPECTED platform package(s) are not on the registry at this version. Publishing now would ship a package pinning versions that do not exist. Run \"Publish platform packages to NPM\" first."
            exit 1
          fi

      # npm tags every publish `latest` unless told otherwise, including prereleases — so
      # publishing 4.1.0-rc.0 would hand it to everyone running a plain `npm install`. A
      # prerelease goes to `next` instead, which is what makes a release candidate safe to cut.
      - name: Choose the dist-tag
        id: disttag
        run: |
          V=$(node -p "require('./package.json').version")
          case "$V" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing $V to dist-tag $TAG"

      # No token: npm mints a short-lived credential from the OIDC token granted by
      # `id-token: write`, provided this package has a Trusted Publisher registered on npmjs.com
      # pointing at this repository, this workflow file and the Production environment.
      #
      # Split rather than branched inside one step, so the step list itself says which ran.
      - name: Publish to NPM
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}

      # Packs the tarball and reports the file list, so a bad `files` entry or a missing binary
      # shows up before the version is spent. It contacts no registry, so it cannot tell you the
      # version is already taken, and `--provenance` needs a real publish to attest — neither is
      # covered here.
      - name: Dry run only — nothing is published
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public
