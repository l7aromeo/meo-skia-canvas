name: Publish to NPM
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Required so `npm publish` knows the registry to authenticate
          # against. The `NODE_AUTH_TOKEN` env var below is then read
          # automatically when this URL is configured.
          registry-url: https://registry.npmjs.org

      - name: Add hashes to package.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --ignore-scripts
          node lib/prebuild.mjs snapshot
          npm pkg get prebuild

      - name: Publish to NPM
        env:
          # Plain-token auth using the `NPM_TOKEN` repository secret.
          # If npm Trusted Publishing is set up for this repo on
          # npmjs.com (Manage Access -> Trusted Publishers), OIDC via
          # the `id-token: write` permission above takes over and the
          # token is ignored; otherwise this falls back to it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
