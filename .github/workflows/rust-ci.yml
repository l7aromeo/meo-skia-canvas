name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/api/native-rust.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/api/native-rust.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests pull image and font fixtures from `tests/assets/`,
          # all LFS-tracked.
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `skia-bindings` first tries to download a prebuilt from
      # rust-skia/skia-binaries releases. Our `freetype` feature combo
      # (embed-freetype + freetype-woff2 + textlayout + webp + svg)
      # is not in the standard prebuilt set, so the download returns
      # 404 and the build falls back to compiling Skia from source.
      # The runner image needs the Skia build deps for that fallback;
      # without these the compile fails on
      # `fontconfig/fontconfig.h: file not found`.
      - name: Install Skia build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libfontconfig1-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (cpu / freetype)
        run: |
          cargo clippy \
            --no-default-features \
            --features "freetype" \
            --all-targets \
            -- -D warnings

      - name: cargo test native_api_contract
        run: |
          cargo test \
            --no-default-features \
            --features "freetype" \
            --test native_api_contract
