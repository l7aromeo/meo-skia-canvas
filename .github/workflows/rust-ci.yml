name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/api/native-rust.md'
      - 'Cargo.toml'
      - 'rustfmt.toml'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/api/native-rust.md'
      - 'Cargo.toml'
      - 'rustfmt.toml'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read

jobs:
  # rustfmt.toml uses nightly-only options (imports_granularity,
  # wrap_comments, ...), so the formatting is defined by *nightly*
  # rustfmt. Stable rustfmt silently ignores those options and is
  # version-fragile, so the format check must run on nightly.
  fmt:
    name: fmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: nightly rustfmt drifts daily, and rustfmt.toml's unstable
      # options make formatting version-sensitive. Bump this in lockstep
      # with a `cargo +nightly-<date> fmt` reformat.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-25
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy axes are the features that gate Rust code behind `#[cfg]`:
  # node-addon, window, vulkan, metal. `freetype` is a skia-safe *build*
  # option (embed-freetype) -- it gates no Rust, so it's pointless here.
  # These three configs cover every `#[cfg]` permutation of our code:
  # everything off, all Linux-gated code on, and Metal (macOS only).
  clippy:
    name: clippy ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: features off
            os: ubuntu-latest
            features: ''
          - name: linux (vulkan,window,node-addon)
            os: ubuntu-latest
            features: vulkan,window,node-addon
          - name: macos (metal,window,node-addon)
            os: macos-latest
            features: metal,window,node-addon
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Skia build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev ninja-build pkg-config \
            python3 libvulkan-dev
      - name: Install Skia build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.features }}
      - name: cargo clippy
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --no-default-features \
              --features "${{ matrix.features }}" --all-targets -- -D warnings
          else
            cargo clippy --no-default-features --all-targets -- -D warnings
          fi

  test:
    name: test (freetype)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Skia build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev ninja-build pkg-config python3
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-freetype
      - run: |
          cargo test \
            --no-default-features \
            --features "freetype" \
            --test native_api_contract
