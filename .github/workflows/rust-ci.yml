name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'lib/**'
      - 'package.json'
      - 'tests/**'
      - 'examples/**'
      - 'docs/rust.md'
      - 'Cargo.toml'
      - 'rustfmt.toml'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'lib/**'
      - 'package.json'
      - 'tests/**'
      - 'examples/**'
      - 'docs/rust.md'
      - 'Cargo.toml'
      - 'rustfmt.toml'
      - '.github/workflows/rust-ci.yml'

# One run per ref at a time. Superseded pull-request runs are cancelled; runs on
# main are not, and the difference is deliberate: `save-if` below restricts cache
# writes to main, so cancelling a main run throws away the only cache every later
# run reads from. Two pushes 69 seconds apart both ran to completion before this
# existed, and five in sixteen minutes the day before -- around ninety minutes of
# compute nobody read.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # rustfmt.toml uses nightly-only options (imports_granularity,
  # wrap_comments, ...), so the formatting is defined by *nightly*
  # rustfmt. Stable rustfmt silently ignores those options and is
  # version-fragile, so the format check must run on nightly.
  fmt:
    name: fmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: nightly rustfmt drifts daily, and rustfmt.toml's unstable
      # options make formatting version-sensitive. Bump this in lockstep
      # with a `cargo +nightly-<date> fmt` reformat.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-10
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy axes are the features that gate Rust code behind `#[cfg]`:
  # node-addon, window, vulkan, metal. `freetype` is a skia-safe *build*
  # option (embed-freetype) -- it gates no Rust, so it's pointless here.
  # These three configs cover every `#[cfg]` permutation of our code:
  # everything off, all Linux-gated code on, and Metal (macOS only).
  clippy:
    name: clippy ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cache-key` exists because a GitHub cache key may not contain a comma, and the feature
          # lists do. Deriving the key from `features` made rust-cache throw a ValidationError on
          # every run with features: the job still passed, since a cache miss is not fatal, but it
          # annotated as an error and the cache never restored, so each run rebuilt from scratch.
          - name: features off
            os: ubuntu-latest
            features: ''
            cacheKey: none
          - name: linux (vulkan,window,node-addon)
            os: ubuntu-latest
            features: vulkan,window,node-addon
            cacheKey: vulkan-window-node-addon
          - name: macos (metal,window,node-addon)
            os: macos-latest
            features: metal,window,node-addon
            cacheKey: metal-window-node-addon
          # Both backends at once. Cargo features are additive, so a binary
          # depending on two crates that each ask for a different backend gets
          # this set, and `gpu` has to resolve `Engine` and `Renderer` to one of
          # them rather than bind each name twice. Nothing else in this matrix
          # reaches that: every other entry has at most one backend, so the
          # duplicate binding compiled everywhere it was tested.
          #
          # rust-skia publishes no prebuilt for the pair, so this entry builds
          # Skia from source and is the slow one. The cache carries it after the
          # first run on main.
          - name: macos (metal,vulkan,window)
            os: macos-latest
            features: metal,vulkan,window
            cacheKey: metal-vulkan-window
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Install Skia build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev nasm ninja-build pkg-config \
            python3 libvulkan-dev
      - name: Install Skia build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cacheKey }}
          # Cache reads inherit downward from the base branch, so a cache written on a PR
          # is read by nothing once that PR merges — it only consumes the shared 10 GB and
          # pushes out entries main still wants. PRs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --no-default-features \
              --features "${{ matrix.features }}" --all-targets -- -D warnings
          else
            cargo clippy --no-default-features --all-targets -- -D warnings
          fi

  test:
    name: test (freetype)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Install Skia build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev nasm ninja-build pkg-config python3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-freetype
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo test \
            --no-default-features \
            --features "freetype"

  # The JavaScript suite against a binary built from this commit — the one thing
  # neither of the other gates can do mid-cycle. `cargo test` above covers the
  # engine but not the binding; ci.yml covers the binding but only against the
  # published binary, which goes stale the moment `src` moves and is skipped from
  # then until the next release. Between those two sits every defect that needs
  # Rust and JavaScript together, which is where the filter-erase bug lived.
  #
  # Linux only, and deliberately not a matrix: this asks "does the binding work",
  # not "does it work everywhere". Per-platform answers come from ci.yml against
  # real artifacts, and from test.yml's weekly from-source build across six
  # OS/Node combinations.
  #
  # Built through `npm run build`, so the feature set is whatever prebuild.mjs
  # selects for the platform — node-addon,vulkan,window,freetype here. Matching
  # the shipped configuration is the point; `freetype` in particular carries
  # WOFF2 decoding, which the font fixtures in tests/assets need.
  binding:
    name: binding (Rust + JS on a fresh build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Install Skia build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev nasm ninja-build pkg-config \
            python3 libvulkan-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: binding
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --ignore-scripts so the install does not fetch a published binary; the
      # build below is the one under test.
      - run: bun install --frozen-lockfile
      - run: npm run build -- dev
      # The `gui` tests run here and nowhere else. `cargo test` builds with
      # default features, where the module does not exist, so the `test` job
      # above skips every test under it -- including the ones pinning the event
      # JSON `lib/classes/gui.js` parses, which exist to catch exactly the kind
      # of change that compiles.
      #
      # The feature set is the one `npm run build` just used on Linux, copied
      # rather than chosen: skia-bindings resolves its prebuilt binary by
      # feature set, so a set that differs by one flag is a Skia build from
      # source. Adding `vulkan` to the cheap `test` job is what taught us that,
      # and it cost a red main. Keep these two in step -- `CARGO_FEATURES` in
      # lib/prebuild.mjs is the source.
      - name: Test the engine against the same build
        run: |
          cargo test \
            --no-default-features \
            --features "node-addon,vulkan,window,freetype"
      # Without the override the optional platform package the install step fetched
      # wins resolution over lib/skia.node, and the suite would quietly exercise
      # the published binary instead of the one just built — the same trap ci.yml
      # documents, and the reason a stale binary went unnoticed for a day here.
      - name: Test rendering against the fresh build
        env:
          MEO_SKIA_CANVAS_BINARY: ${{ github.workspace }}/lib/skia.node
        run: npm test

  # `rust-version` is a promise to every consumer and nothing checked it. It
  # said 1.85 through a published release while the crate used let-chains in 33
  # places, which need 1.88 -- edition 2024 makes 1.85 look right, and no
  # dependency contradicts it, so the declaration was coherent and false.
  #
  # The toolchain is read from Cargo.toml rather than pinned here, so the job
  # always checks whatever the crate currently claims: bump `rust-version` and
  # this follows, use a newer feature without bumping and this fails.
  msrv:
    name: msrv (from Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: declared
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "Error: Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checking against Rust $version"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.declared.outputs.version }}
      - name: Install Skia build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev nasm ninja-build pkg-config \
            python3 libvulkan-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.declared.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Linux feature set, so the cfg-gated code compiles here rather than
      # being skipped. `--all-targets` is deliberately absent: the MSRV applies
      # to the library a consumer builds, not to this repo's dev-dependencies.
      - run: cargo check --no-default-features --features "vulkan,window"

  # The README and the crate docs both promise that no public signature hands
  # you a `skia_safe` or `neon` type, and nothing checked it. The promise was
  # partly false when this job was written -- four `gui` methods passed Skia's
  # Matrix, Color and SurfaceProps through, and the script carried an explicit
  # exemption for that module rather than a clean bill. Those four now take and
  # return the crate's own types, so `EXEMPT_MODULES` is empty and this checks
  # the whole crate.
  #
  # Nightly because rustdoc's JSON output is unstable, and it is the only form
  # that records which crate a type in a signature came from: the HTML renders
  # `skia_safe::Color` as a bare `Color`, so a grep over it reports success on a
  # tree that leaks. Pinned with the fmt job -- bump both together.
  public-api:
    name: public API (no leaked types)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-10
      - name: Install Skia build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev nasm ninja-build pkg-config \
            python3 libvulkan-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: public-api
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo rustdoc --no-default-features --features "vulkan,window" \
            -- -Z unstable-options --output-format json
      - run: node scripts/check-public-api.mjs target/doc/meo_skia_canvas.json

  docs:
    name: docs (rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Install Skia build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev nasm ninja-build pkg-config python3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Builds what docs.rs will render, so the feature set here must stay in
      # step with `[package.metadata.docs.rs]` in Cargo.toml. `-D warnings`
      # makes a broken intra-doc link fail here instead of shipping as a dead
      # link on the published page -- two were already live before this job
      # existed, because nothing had run rustdoc in anger.
      #
      # `missing_docs` is a rustc lint and is already enforced by the clippy
      # job; this one is about what rustdoc itself reports.
      - run: |
          RUSTDOCFLAGS="-D warnings" cargo doc \
            --no-deps \
            --no-default-features \
            --features "vulkan,window"
