name: Rust CI

on:
  # No path filter on either trigger. A required check that never reports is
  # unmet rather than absent, and a filtered-out trigger produces no run at
  # all, so nothing inside it -- an aggregate with `always()` included -- can
  # report. And a `paths:` filter takes only a literal list, so it would be a
  # second copy of `paths/rust-ci.txt` -- the copy this trigger carried had
  # neither `Cargo.lock` nor `build.rs`, so a merge touching only those ran no
  # Rust CI on main. The `changes` job below reads the one list for both
  # events and skips the work instead, which leaves something to report.
  push:
    branches: [main]
  pull_request:

# One run per ref at a time. Superseded pull-request runs are cancelled; runs on
# main are not, and the difference is deliberate: `save-if` below restricts cache
# writes to main, so cancelling a main run throws away the only cache every later
# run reads from. Two pushes 69 seconds apart both ran to completion before this
# existed, and five in sixteen minutes the day before -- around ninety minutes of
# compute nobody read.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What moved, for both triggers, in git's pathspec spelling, as three answers:
  #
  # - `relevant`: anything in `paths/rust-ci.txt`. The jobs that read Markdown
  #   -- the changelog and licence checks -- run on this.
  # - `native`: the same less its Markdown. Every job that reads no Markdown
  #   runs on this, the macOS ones among them, so a pull request changing only
  #   prose starts none of them.
  # - `doctests`: anything in `paths/doctests.txt`, the Markdown compiled into
  #   the crate as doctests, which `test` runs.
  #
  # `:(glob)` keeps `*` from crossing a directory separator and lets `**/`
  # match no directory at all, so `**/*.md` is every Markdown file in the tree.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.scan.outputs.relevant }}
      native: ${{ steps.scan.outputs.native }}
      doctests: ${{ steps.scan.outputs.doctests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scan
        env:
          # A pull request compares its base with its head; a push to main
          # compares the commit it moved from with the one it moved to.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # No earlier commit to compare with -- a ref created by this push
          # reports all zeros, and one rewritten by a force-push may name a
          # commit this clone does not have. Run everything rather than guess.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            printf '%s=true\n' relevant native doctests >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pathspecs live beside this workflow rather than in it, so the
          # check that guards them reads the same copy. `mapfile` keeps one
          # spec per element, which `$(...)` word-splitting would not.
          mapfile -t SPECS < <(grep -vE '^[[:space:]]*(#|$)' ".github/workflows/paths/rust-ci.txt")
          mapfile -t DOCTESTS < <(grep -vE '^[[:space:]]*(#|$)' ".github/workflows/paths/doctests.txt")
          # An empty list would reach `git diff` as no pathspec at all, which
          # means every file, so it is refused rather than read as "anything".
          scan() {
            local name=$1 moved
            shift
            if [ "$#" -eq 0 ]; then
              echo "::error::\`$name\` has no pathspecs to scan"
              exit 1
            fi
            moved=$(git diff --name-only "$BASE" "$HEAD" -- "$@")
            if [ -n "$moved" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "$name: moved"
              echo "$moved"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
              echo "$name: nothing moved"
            fi
          }
          scan relevant "${SPECS[@]}"
          scan native "${SPECS[@]}" ':(glob,exclude)**/*.md'
          scan doctests "${DOCTESTS[@]}"

  # rustfmt.toml uses nightly-only options (imports_granularity,
  # wrap_comments, ...), so the formatting is defined by *nightly*
  # rustfmt. Stable rustfmt silently ignores those options and is
  # version-fragile, so the format check must run on nightly.
  fmt:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: fmt (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: nightly rustfmt drifts daily, and rustfmt.toml's unstable
      # options make formatting version-sensitive. Bump this in lockstep
      # with a `cargo +nightly-<date> fmt` reformat.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-09-04
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy axes are the features that gate Rust code behind `#[cfg]`:
  # node-addon, window, vulkan, metal, fetch. `freetype` is a skia-safe *build*
  # option (embed-freetype) -- it gates no Rust, so it's pointless here.
  # Four configs: everything off, all Linux-gated code on, Metal (macOS
  # only), and both backends at once -- the last because cargo features are
  # additive and nothing else in the matrix compiles the pair. The entry says
  # why. The two single-platform legs also lint their backend alone
  # (`backendOnly`), the GPU path without `window` that docs/rust.md
  # documents: an import used only under `window` inside a backend's module
  # is unused there, and no full set reaches that. It enables the same
  # skia-safe features as the leg's own set, so it reuses the leg's Skia.
  # Not every permutation is built: each pass is here for a `#[cfg]`
  # combination none of the others compiles.
  # The patched Skia tree each platform's source builds compile from -- the
  # macOS clippy legs, and on Linux the clippy legs and every job that builds
  # Skia -- prepared once per platform.
  # On a cold cache the two legs used to prepare it side by side, each running
  # Skia's git-sync-deps -- dozens of parallel fetches from googlesource -- at
  # the same moment, and googlesource answered one of them with 429s. Here
  # one job fetches and saves it, and the legs below restore what it saved.
  # `lookup-only` makes a warm cache cost a key lookup rather than a download,
  # so the matrix waits seconds for this on an ordinary run.
  skia-source:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: skia source (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
          - label: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same key .github/actions/skia-source restores under: the tree's
      # name for this runner's platform, from scripts/skia-source.mjs, which
      # carries the version and the patches' digest. Assigned before it is
      # written out, so that a failing `cache-key` fails the step.
      - name: Name the Skia source's cache key
        id: skia-key
        run: |
          key=$(node scripts/skia-source.mjs cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Look up the Skia source
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/meo-skia-canvas
          key: ${{ steps.skia-key.outputs.key }}
          lookup-only: true
      - name: Prepare the Skia source
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/skia-source.mjs prepare

  clippy:
    needs: [changes, skia-source]
    if: needs.changes.outputs.native == 'true'
    name: clippy ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cache-key` exists because a GitHub cache key may not contain a comma, and the feature
          # lists do. Deriving the key from `features` made rust-cache throw a ValidationError on
          # every run with features: the job still passed, since a cache miss is not fatal, but it
          # annotated as an error and the cache never restored, so each run rebuilt from scratch.
          - name: features off
            os: ubuntu-latest
            features: ""
            cacheKey: none
          - name: linux (vulkan,window,node-addon,fetch)
            os: ubuntu-latest
            features: vulkan,window,node-addon,fetch
            backendOnly: vulkan
            cacheKey: vulkan-window-node-addon-fetch
          - name: macos (metal,window,node-addon,fetch)
            os: macos-latest
            features: metal,window,node-addon,fetch
            backendOnly: metal
            cacheKey: metal-window-node-addon-fetch
          # Both backends at once. Cargo features are additive, so a binary
          # depending on two crates that each ask for a different backend gets
          # this set, and `gpu` has to resolve `Engine` and `Renderer` to one of
          # them rather than bind each name twice. Nothing else in this matrix
          # reaches that: every other entry has at most one backend, so the
          # duplicate binding compiled everywhere it was tested.
          #
          # Like the entry above, it builds Skia from the patched source the
          # steps below prepare, and it compiles Vulkan's half as well, so it
          # is the slow one. The cache carries both after the first run on main.
          - name: macos (metal,vulkan,window)
            os: macos-latest
            features: metal,vulkan,window
            cacheKey: metal-vulkan-window
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      # yasm, because libaom's configure takes yasm before nasm, and the nasm
      # ubuntu-latest carries from Ubuntu 26.04 on is 3.x, which libaom 3.11
      # refuses -- "Unsupported nasm: multipass optimization not supported" --
      # because its probe greps `nasm -hf` for `-Ox` and nasm 3 moved that text.
      # UPSTREAM: libaom-sys 0.17.2+libaom.3.11.0 -- njaard/libavif-rs#122 -- worked around
      # Re-check: grep -A1 '^name = "libaom-sys"' Cargo.lock -- drop yasm once it names libaom 3.13.2 or later
      - name: Install Skia build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          .github/scripts/apt-install.sh \
            clang libfontconfig1-dev libssl-dev nasm yasm ninja-build pkg-config \
            python3 libvulkan-dev
      - name: Install Skia build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      # Each leg lints what ships: Skia built from the patched tree the
      # justfile's `dotenv-command` names locally, which the `skia-source` job
      # above saved for this platform. This job runs cargo directly, so the
      # action sets `SKIA_SOURCE_DIR` itself.
      - id: skia
        uses: ./.github/actions/skia-source
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.skia.outputs.key }}-${{ matrix.os }}-${{ matrix.cacheKey }}
          # Cache reads inherit downward from the base branch, so a cache written on a PR
          # is read by nothing once that PR merges — it only consumes the shared 10 GB and
          # pushes out entries main still wants. PRs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --no-default-features \
              --features "${{ matrix.features }}" --all-targets -- -D warnings
          else
            cargo clippy --no-default-features --all-targets -- -D warnings
          fi
      - name: cargo clippy (backend alone)
        if: matrix.backendOnly
        run: |
          cargo clippy --no-default-features \
            --features "${{ matrix.backendOnly }}" --all-targets -- -D warnings
      # No leg here runs `skia-source.mjs cargo-patch`, so each is the build a
      # crates.io user makes: skia-bindings and skia-safe from crates.io, and
      # `cfg(meo_graphite)` off, which is what proves the Graphite code sits
      # wholly behind it. Asserted rather than assumed, so that a cargo config
      # left in the tree cannot make every leg pass for the wrong reason.
      - name: skia-bindings comes from crates.io
        if: matrix.name == 'features off'
        run: |
          node scripts/check-cargo-lock.mjs
          cargo metadata --locked --format-version 1 | node -e '
            let text = "";
            process.stdin.on("data", (chunk) => (text += chunk)).on("end", () => {
              const found = JSON.parse(text).packages.filter((p) => p.name === "skia-bindings");
              if (found.length !== 1 || !String(found[0].source).startsWith("registry+")) {
                console.error("skia-bindings is not from crates.io:", found.map((p) => p.source));
                process.exit(1);
              }
              console.log("skia-bindings from", found[0].source);
            });'

  # The Graphite bindings `containers/rust-skia-graphite-bindings.patch` adds
  # to rust-skia, built through `skia-source.mjs cargo-patch` and held to
  # `tests/graphite_bindings.rs` on Metal. The build has to print the notice
  # `graphite_bindings` in build.rs prints, or `cfg(meo_graphite)` never turned
  # on and the tests compiled to nothing; and it has to leave Cargo.lock as it
  # found it once restored.
  graphite-bindings:
    needs: [changes, skia-source]
    if: needs.changes.outputs.native == 'true'
    name: graphite bindings (patched, Metal)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install Skia build dependencies (macOS)
        run: brew install ninja
      - id: skia
        uses: ./.github/actions/skia-source
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.skia.outputs.key }}-graphite-bindings
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Point the build at the patched rust-skia
        run: node scripts/skia-source.mjs cargo-patch
      - name: Test the bindings
        run: |
          cargo test --no-default-features --features "metal,skia-safe/graphite" \
            --test graphite_bindings 2>&1 | tee graphite-bindings.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: The patched bindings were in the build
        run: |
          grep -F "meo_graphite: the patched Graphite bindings are in this build" graphite-bindings.log
      - name: Cargo.lock is restored
        run: |
          node scripts/skia-source.mjs cargo-patch --remove
          git checkout -- Cargo.lock
          node scripts/check-cargo-lock.mjs
          git diff --exit-code

  # Runs the doctests too, so a change to the Markdown they are compiled from
  # runs it without the native jobs. `skia-source` is then skipped, and is
  # not needed: it only primes the cache, and the action below prepares the
  # tree itself on a miss. Neither skipped nor succeeded, it stops this job as
  # it always has.
  test:
    needs: [changes, skia-source]
    if: >-
      !cancelled()
      && contains(fromJSON('["success", "skipped"]'), needs.skia-source.result)
      && (needs.changes.outputs.native == 'true'
          || needs.changes.outputs.doctests == 'true')
    name: test (freetype,fetch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # yasm, because libaom's configure takes yasm before nasm, and the nasm
      # ubuntu-latest carries from Ubuntu 26.04 on is 3.x, which libaom 3.11
      # refuses -- "Unsupported nasm: multipass optimization not supported" --
      # because its probe greps `nasm -hf` for `-Ox` and nasm 3 moved that text.
      # UPSTREAM: libaom-sys 0.17.2+libaom.3.11.0 -- njaard/libavif-rs#122 -- worked around
      # Re-check: grep -A1 '^name = "libaom-sys"' Cargo.lock -- drop yasm once it names libaom 3.13.2 or later
      - name: Install Skia build dependencies (apt)
        run: |
          .github/scripts/apt-install.sh \
            clang libfontconfig1-dev libssl-dev nasm yasm ninja-build pkg-config python3
      # The patched Skia tree the skia-source job saved: on Linux it carries
      # the brotli sources Skia's build list leaves out, which a `freetype`
      # link needs. It also keeps any `just` recipe here from fetching one.
      - id: skia
        uses: ./.github/actions/skia-source
      # poppler's `pdftoppm`, which `tests/pdf_blend.rs` renders the PDF's
      # blends with; the test fails on CI where it is missing, rather than
      # skip and stop guarding them. The runner's own distribution package.
      - name: Install poppler (apt)
        run: .github/scripts/apt-install.sh poppler-utils
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.skia.outputs.key }}-test-freetype-fetch
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo test \
            --no-default-features \
            --features "freetype,fetch"

  # The JavaScript suite against a binary built from this commit — the one thing
  # neither of the other gates can do mid-cycle. `cargo test` above covers the
  # engine but not the binding; ci.yml covers the binding but only against the
  # published binary, which goes stale the moment `src` moves and is skipped from
  # then until the next release. Between those two sits every defect that needs
  # Rust and JavaScript together, which is where the filter-erase bug lived.
  #
  # Linux only, and deliberately not a matrix: this asks "does the binding work",
  # not "does it work everywhere". Per-platform answers come from ci.yml against
  # real artifacts, and from test.yml's weekly from-source build across six
  # OS/Node combinations.
  #
  # Built through `bun run build`, so the feature set is whatever prebuild.mjs
  # selects for the platform — node-addon,vulkan,window,freetype here. Matching
  # the shipped configuration is the point; `freetype` in particular carries
  # WOFF2 decoding, which the font fixtures in tests/assets need.
  binding:
    needs: [changes, skia-source]
    if: needs.changes.outputs.native == 'true'
    name: binding (Rust + JS on a fresh build)
    runs-on: ubuntu-latest
    # Sized for a run with nothing cached, which every new Skia tree starts
    # with, and which must finish for rust-cache to save at all -- it saves in
    # its post step, which a cancelled job skips, so a timeout here leaves
    # every later run as cold. `just typecheck` compiles Skia a second time:
    # `cargo check` runs skia-bindings' build script into an out-dir of its
    # own. A warm run skips both Skia compiles. A cold run took 55 minutes on
    # #635. On #644 the addon build took 19.4, the engine's `cargo test` 20.2,
    # and `just typecheck` was still running 18 minutes in when a limit of 60
    # cancelled it, with about 2 minutes of steps still to come: at least 62
    # in all, the typecheck's own length unknown. 90 leaves 28 minutes over
    # that sum, for the rest of the typecheck and a slower runner.
    timeout-minutes: 90
    steps:
      # A debug build of the addon plus every test binary and example, on top
      # of the restored cache, fills the runner's disk: the link fails with
      # "No space left on device" before a test runs. The image's Android SDK,
      # .NET, GHC and CodeQL bundle are nothing this job uses. `df` before and
      # after puts the free space in the log.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # yasm, because libaom's configure takes yasm before nasm, and the nasm
      # ubuntu-latest carries from Ubuntu 26.04 on is 3.x, which libaom 3.11
      # refuses -- "Unsupported nasm: multipass optimization not supported" --
      # because its probe greps `nasm -hf` for `-Ox` and nasm 3 moved that text.
      # UPSTREAM: libaom-sys 0.17.2+libaom.3.11.0 -- njaard/libavif-rs#122 -- worked around
      # Re-check: grep -A1 '^name = "libaom-sys"' Cargo.lock -- drop yasm once it names libaom 3.13.2 or later
      - name: Install Skia build dependencies (apt)
        run: |
          .github/scripts/apt-install.sh \
            clang libfontconfig1-dev libssl-dev nasm yasm ninja-build pkg-config \
            python3 libvulkan-dev
      # What it takes to open a window on a runner with no screen and no GPU,
      # which is the difference between the `gui` suite running here and
      # skipping as it does everywhere else. The list and why each part is
      # there are in the script, which crates-io-publish.yml runs too.
      - name: Install a headless display and a software GPU (apt)
        run: .github/scripts/install-software-gpu.sh
      # The patched Skia tree the skia-source job saved: on Linux it carries
      # the brotli sources Skia's build list leaves out, which a `freetype`
      # link needs. It also keeps any `just` recipe here from fetching one.
      - id: skia
        uses: ./.github/actions/skia-source
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.skia.outputs.key }}-binding
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --ignore-scripts so the install does not fetch a published binary; the
      # build below is the one under test.
      - run: bun install --frozen-lockfile --ignore-scripts
      # The bare `node --test` below discovers `tests/static/` along with
      # everything else, and `parity-npm.test.js` there loads the npm
      # extractor, which needs the TypeScript pinned beside it rather than the
      # root's 7.x. `check-dts-surface` below installs it as a side effect of
      # its own recipe, so this job would pass without this step -- until that
      # step moves or goes, and then it fails with an error naming neither.
      # Stated here so the dependency does not rest on the order of two
      # unrelated steps.
      - run: bun install --cwd scripts/api-surface --frozen-lockfile
      - run: bun run build -- dev
      # The `gui` tests run here and nowhere else. `cargo test` builds with
      # default features, where the module does not exist, so the `test` job
      # above skips every test under it -- including the ones pinning the event
      # JSON `lib/classes/gui.js` parses, which exist to catch exactly the kind
      # of change that compiles.
      #
      # The feature set is the one `bun run build` just used on Linux, copied
      # rather than chosen: skia-bindings resolves its prebuilt binary by
      # feature set, so a set that differs by one flag is a Skia build from
      # source. Adding `vulkan` to the cheap `test` job is what taught us that,
      # and it cost a red main. Keep these two in step -- `CARGO_FEATURES` in
      # lib/prebuild.mjs is the source.
      # The declarations against the addon just built. It lives here rather
      # than in a job of its own because `check-dts-surface` needs a built
      # addon and this is the only job that has one -- anywhere else it would
      # pay for a second build to check a file it could not otherwise see.
      # The recipe re-runs `bun run build -- dev`, which cargo no-ops.
      - name: Check the declarations against the built addon
        run: just check-dts-surface

      # `MEO_SKIA_CANVAS_REQUIRE_GPU` names the device tests/gpu_path_coverage.rs
      # and tests/gpu_crowded_flush.rs have to draw on, lavapipe's `llvmpipe`,
      # so a green run says they drew there rather than skipped for want of a
      # GPU.
      # poppler's `pdftoppm`, which `tests/pdf_blend.rs` renders the PDF's
      # blends with; the test fails on CI where it is missing, rather than
      # skip and stop guarding them. The runner's own distribution package.
      - name: Install poppler (apt)
        run: .github/scripts/apt-install.sh poppler-utils
      - name: Test the engine against the same build
        env:
          MEO_SKIA_CANVAS_REQUIRE_GPU: llvmpipe
        run: |
          cargo test \
            --no-default-features \
            --features "node-addon,vulkan,window,freetype"
      - name: TEMPORARY full text reach sweep on FreeType without the font's box
        env:
          TEXT_REACH_SWEEP: full
          MEO_TEXT_REACH_WITHOUT_FONT_BOX: "1"
        run: |
          fc-list : family | sort -u
          cargo test \
            --no-default-features \
            --features "node-addon,vulkan,window,freetype" \
            --lib -- text_in_a_chain_is_bounded_by_all_it_inks --nocapture
      # `just check-bench-parity`: both benchmarks list the same cases. The
      # crate's side builds its example with `test_features`, whose Skia is
      # this job's -- `fetch` and `window` change no Skia feature -- so it
      # reuses this build. Here rather than in ci.yml's `repo` job, which
      # builds no Skia.
      - name: The two benchmarks run the same cases
        run: just check-bench-parity
      # `just typecheck`, as `just ci` runs it: every target checked with
      # `vulkan,window,freetype`, and the shipped TypeScript declarations. The
      # Skia features are this job's build's, but `cargo check` runs
      # skia-bindings' build script into an out-dir of its own, so a cold run
      # compiles Skia again here, about 12 minutes; the job's Rust cache keeps
      # both.
      - name: Type-check every target with the Linux feature set
        run: just typecheck
      # The engine's `cargo test` runs `window_handle` with no display, where
      # it reports a skip. Here it opens a real window: a `WindowHandle` change
      # made on a worker thread has to reach the window system. Required, so a
      # missing display or GPU fails the step rather than skipping it.
      - name: Change a window from another thread on a real display
        env:
          MEO_SKIA_CANVAS_REQUIRE_WINDOWING: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            cargo test \
              --no-default-features \
              --features "node-addon,vulkan,window,freetype" \
              --test window_handle
      # Without the override the optional platform package the install step fetched
      # wins resolution over lib/skia.node, and the suite would quietly exercise
      # the published binary instead of the one just built — the same trap ci.yml
      # documents, and the reason a stale binary went unnoticed for a day here.
      # Under `xvfb-run`, so the `gui` suite builds real windows rather than
      # skipping. `-a` picks a free display; the depth has to be 24, since a
      # window on an 8-bit root finds no visual.
      #
      # The two node flags cover different failures and neither substitutes
      # for the other. `--test-timeout` fails a test that never settles --
      # a window that stops reporting frames, or a loop that outlives the
      # `close` meant to end it -- which is the case that would otherwise
      # run to the job's 45 minutes, because `node --test` has no per-test
      # timeout by default. `--test-force-exit` covers the case after the
      # run: tests all passed, and a leaked handle keeps the process alive
      # anyway. It does *not* interrupt a hanging test, measured -- a test
      # awaiting a promise that never resolves was still running six
      # seconds in with the flag set, and exited at once when the timeout
      # was added beside it.
      - name: Test rendering against the fresh build
        env:
          MEO_SKIA_CANVAS_BINARY: ${{ github.workspace }}/lib/skia.node
          # Without this the suite skips every `gui` test when the software
          # GPU or the display is missing, and the job goes green having run
          # none of them -- the failure this leg exists to prevent, one level
          # up. Set here and nowhere else.
          MEO_SKIA_CANVAS_REQUIRE_WINDOWING: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            node --test --test-timeout=60000 --test-force-exit

  # `rust-version` is a promise to every consumer and nothing checked it. It
  # said 1.85 through a published release while the crate used let-chains in 33
  # places, which need 1.88 -- edition 2024 makes 1.85 look right, and no
  # dependency contradicts it, so the declaration was coherent and false.
  #
  # The toolchain is read from Cargo.toml rather than pinned here, so the job
  # always checks whatever the crate currently claims: bump `rust-version` and
  # this follows, use a newer feature without bumping and this fails.
  # The cfg combination no other job compiles: tests on, debug assertions
  # off. Its own job, with its own cache, because a build script's output
  # belongs to the profile that ran it: in release, libaom-sys compiles
  # libaom's C code again, about 18 of the step's 20 minutes on a runner.
  # Run as a step of `binding`, that build was never cached. The binding key
  # already existed, and rust-cache does not save over an existing key, so
  # every run rebuilt it. Here the first run on main saves it and later runs
  # restore it. The feature set is the release addon's, `CARGO_FEATURES` in
  # lib/prebuild.mjs, and skia-bindings builds it from the patched tree in the
  # release profile -- about 8 minutes on a runner, a Skia no other job builds,
  # so it is cached under a key of its own.
  release-tests:
    needs: [changes, skia-source]
    if: needs.changes.outputs.native == 'true'
    name: release tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # yasm, for the reason the clippy job gives.
      # UPSTREAM: libaom-sys 0.17.2+libaom.3.11.0 -- njaard/libavif-rs#122 -- worked around
      # Re-check: grep -A1 '^name = "libaom-sys"' Cargo.lock -- drop yasm once it names libaom 3.13.2 or later
      - name: Install Skia build dependencies (apt)
        run: |
          .github/scripts/apt-install.sh \
            clang libfontconfig1-dev libssl-dev nasm yasm ninja-build pkg-config \
            python3 libvulkan-dev
      # The patched Skia tree the skia-source job saved: on Linux it carries
      # the brotli sources Skia's build list leaves out, which a `freetype`
      # link needs. It also keeps any `just` recipe here from fetching one.
      - id: skia
        uses: ./.github/actions/skia-source
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.skia.outputs.key }}-release-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the release test build
        run: just check-release-tests

  msrv:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: msrv (from Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: declared
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "Error: Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checking against Rust $version"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.declared.outputs.version }}
      # yasm, because libaom's configure takes yasm before nasm, and the nasm
      # ubuntu-latest carries from Ubuntu 26.04 on is 3.x, which libaom 3.11
      # refuses -- "Unsupported nasm: multipass optimization not supported" --
      # because its probe greps `nasm -hf` for `-Ox` and nasm 3 moved that text.
      # UPSTREAM: libaom-sys 0.17.2+libaom.3.11.0 -- njaard/libavif-rs#122 -- worked around
      # Re-check: grep -A1 '^name = "libaom-sys"' Cargo.lock -- drop yasm once it names libaom 3.13.2 or later
      - name: Install Skia build dependencies (apt)
        run: |
          .github/scripts/apt-install.sh \
            clang libfontconfig1-dev libssl-dev nasm yasm ninja-build pkg-config \
            python3 libvulkan-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.declared.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Linux feature set and `fetch`, so the cfg-gated code and the HTTP
      # client compile here rather than being skipped. `--all-targets` is
      # deliberately absent: the MSRV applies to the library a consumer builds,
      # not to this repo's dev-dependencies.
      - run: cargo check --no-default-features --features "vulkan,window,fetch"

  # The README and the crate docs both promise that no public signature hands
  # you a `skia_safe` or `neon` type, and nothing checked it. The promise was
  # partly false when this job was written -- four `gui` methods passed Skia's
  # Matrix, Color and SurfaceProps through, and the script carried an explicit
  # exemption for that module rather than a clean bill. Those four now take and
  # return the crate's own types, so `EXEMPT_MODULES` is empty and this checks
  # the whole crate.
  #
  # Nightly because rustdoc's JSON output is unstable, and it is the only form
  # that records which crate a type in a signature came from: the HTML renders
  # `skia_safe::Color` as a bare `Color`, so a grep over it reports success on a
  # tree that leaks. Pinned with the fmt job -- bump both together.
  public-api:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: public API (no leaked types)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-09-04
      # yasm, because libaom's configure takes yasm before nasm, and the nasm
      # ubuntu-latest carries from Ubuntu 26.04 on is 3.x, which libaom 3.11
      # refuses -- "Unsupported nasm: multipass optimization not supported" --
      # because its probe greps `nasm -hf` for `-Ox` and nasm 3 moved that text.
      # UPSTREAM: libaom-sys 0.17.2+libaom.3.11.0 -- njaard/libavif-rs#122 -- worked around
      # Re-check: grep -A1 '^name = "libaom-sys"' Cargo.lock -- drop yasm once it names libaom 3.13.2 or later
      - name: Install Skia build dependencies (apt)
        run: |
          .github/scripts/apt-install.sh \
            clang libfontconfig1-dev libssl-dev nasm yasm ninja-build pkg-config \
            python3 libvulkan-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: public-api
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo rustdoc --no-default-features --features "vulkan,window,fetch" \
            -- -Z unstable-options --output-format json
      - run: node scripts/check-public-api.mjs target/doc/meo_skia_canvas.json
      # What the crate's graph holds rather than what its signatures name, but
      # the same promise from the other side: `fetch` brings no HTTP client or
      # TLS stack into a build that did not ask for it, and no aws-lc into one
      # that did. `cargo tree` resolves without building, so it costs seconds.
      - run: node scripts/check-fetch-deps.mjs

  # `git tag` is this gate's reference, so the checkout has to carry the tags
  # AND the history behind them. `actions/checkout` defaults to depth 1 with no
  # tags, and the two failure modes differ: with no tags the gate says it cannot
  # see its reference, but with tags fetched into a shallow clone every tag is
  # unreachable from `HEAD` and the walk skips all of them -- a green run that
  # checked nothing. Measured on a depth-1 clone of this repository: 142 tags
  # present, 0 reachable, exit 0. The gate now refuses a shallow clone outright,
  # and `fetch-depth: 0` is what lets it do its job rather than refuse.
  changelog:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: changelog (every shipped tag has a section)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just check-changelog

  # The notices file states how many crate versions link into a released
  # binary, and `just licenses` refuses when the graph disagrees. A dependency
  # update that adds a crate changes that count without touching any source,
  # so without this job it merged green and failed the next `just ci` on main.
  # It reads the dependency graph and builds nothing: no Skia, no cache.
  licenses:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: licenses (notices match what links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just licenses

  # The crate and npm surfaces against the manifest that records how they
  # correspond. Its own job rather than a step in `binding`, because the
  # rustdoc pass runs under the pinned nightly while that job builds on stable,
  # and sharing one target directory between two toolchains buys nothing -- the
  # Rust artifacts are not interchangeable and the expensive part, Skia itself,
  # is keyed by feature set rather than by compiler.
  #
  # The feature set is the recipe's `linux_features`, reached by calling the
  # recipe rather than by copying the flags: this gate exists because CI and
  # `just ci` had drifted, and restating a feature set here is how that starts
  # again. `node-addon` is absent from it and that costs nothing -- the feature
  # enables no skia-safe features, so it selects the same Skia as the binding
  # job's build.
  parity:
    needs: [changes, skia-source]
    if: needs.changes.outputs.native == 'true'
    name: parity (crate and npm surfaces agree)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-09-04
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # yasm, because libaom's configure takes yasm before nasm, and the nasm
      # ubuntu-latest carries from Ubuntu 26.04 on is 3.x, which libaom 3.11
      # refuses -- "Unsupported nasm: multipass optimization not supported" --
      # because its probe greps `nasm -hf` for `-Ox` and nasm 3 moved that text.
      # UPSTREAM: libaom-sys 0.17.2+libaom.3.11.0 -- njaard/libavif-rs#122 -- worked around
      # Re-check: grep -A1 '^name = "libaom-sys"' Cargo.lock -- drop yasm once it names libaom 3.13.2 or later
      - name: Install Skia build dependencies (apt)
        run: |
          .github/scripts/apt-install.sh \
            clang libfontconfig1-dev libssl-dev nasm yasm ninja-build pkg-config \
            python3 libvulkan-dev
      # The patched Skia tree the skia-source job saved: on Linux it carries
      # the brotli sources Skia's build list leaves out, which a `freetype`
      # link needs. It also keeps any `just` recipe here from fetching one.
      - id: skia
        uses: ./.github/actions/skia-source
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.skia.outputs.key }}-parity
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just check-parity

  docs:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: docs (rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # yasm, because libaom's configure takes yasm before nasm, and the nasm
      # ubuntu-latest carries from Ubuntu 26.04 on is 3.x, which libaom 3.11
      # refuses -- "Unsupported nasm: multipass optimization not supported" --
      # because its probe greps `nasm -hf` for `-Ox` and nasm 3 moved that text.
      # UPSTREAM: libaom-sys 0.17.2+libaom.3.11.0 -- njaard/libavif-rs#122 -- worked around
      # Re-check: grep -A1 '^name = "libaom-sys"' Cargo.lock -- drop yasm once it names libaom 3.13.2 or later
      - name: Install Skia build dependencies (apt)
        run: |
          .github/scripts/apt-install.sh \
            clang libfontconfig1-dev libssl-dev nasm yasm ninja-build pkg-config python3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Builds what docs.rs will render, so the feature set here must stay in
      # step with `[package.metadata.docs.rs]` in Cargo.toml. `-D warnings`
      # makes a broken intra-doc link fail here instead of shipping as a dead
      # link on the published page -- two were already live before this job
      # existed, because nothing had run rustdoc in anger.
      #
      # `missing_docs` is a rustc lint and is already enforced by the clippy
      # job; this one is about what rustdoc itself reports.
      - run: |
          RUSTDOCFLAGS="-D warnings" cargo doc \
            --no-deps \
            --no-default-features \
            --features "vulkan,window,fetch"

  # A doc block written above an existing one rather than above its own item
  # reattaches silently: rustdoc joins the two, both land on the following item,
  # and the item the first block described is left with no documentation. Nine
  # of these were found in seven files, one of them already rendering wrong on
  # docs.rs, and five introduced within two days -- one while fixing another.
  #
  # Neither existing gate can see it. `missing_docs` is satisfied because a
  # comment exists, and rustdoc has no opinion about which item a comment
  # describes, so the `docs` job above is green on every one of them. A human
  # reviewer reads the block as the item's own; one of the nine passed review.
  #
  # Scoped to the diff rather than the tree, deliberately -- see the reasoning
  # in the script. The pattern cannot be made exact, so a tree-wide gate would
  # cost reworded prose and buy nothing; "do not add another one" is the failure
  # that actually happens.
  # Deletes the cache entries nothing will restore again, so they stop holding
  # room in the repository's 10 GB while current ones are evicted: main's
  # entries for a Skia tree a patch change superseded, a closed pull request's
  # and a deleted branch's, buildx blobs containers.yml's latest successful
  # run on main left untouched, and a Rust cache a newer one of its job
  # replaced. `.github/scripts/prune-caches.mjs` decides, one function a rule.
  # An entry created since this run started is kept, since a newer commit's
  # run -- build.yml's, say -- may have saved it for a tree this checkout
  # does not know. On a push to main only, which is also when the caches it
  # would replace are saved. Main's runs of this workflow queue rather than
  # overlap, and an entry this run saves names its current tree, which is
  # never stale.
  prune-caches:
    name: prune superseded caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Deleting a cache entry needs write, which also lets it list the
      # caches and read containers.yml's runs. Listing the branches needs
      # contents, and the open pull requests pull-requests: a pull request's
      # entries go once it is closed.
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete entries nothing will restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/prune-caches.mjs --delete

  doc-anchors:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check needs the base commit to diff against, which a shallow
          # clone does not have.
          fetch-depth: 0
      - name: Doc comments anchor to their own item, and none are dropped
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..HEAD"
          fi
          echo "range: $RANGE"
          node scripts/check-stacked-docs.mjs --self-test
          node scripts/check-stacked-docs.mjs --range "$RANGE"

  # The one context this workflow offers a branch ruleset. It runs whatever the
  # jobs above did, so a pull request that skips all ten still reports rather
  # than leaving a required check that never arrives.
  #
  # A skipped dependency passes, a failed or cancelled one fails. The test lists
  # what is acceptable rather than looking for what is not: an unrecognised
  # result -- a state GitHub adds later, or an empty value from a dependency
  # that never resolved -- fails the gate instead of passing a check written
  # only for today's states.
  #
  # `needs` must name every job above. Nothing in YAML enforces that, so
  # `just check-workflow-gates` does.
  rust-ci:
    name: rust-ci
    if: always()
    needs:
      [
        changes,
        fmt,
        skia-source,
        clippy,
        graphite-bindings,
        test,
        binding,
        release-tests,
        msrv,
        public-api,
        changelog,
        licenses,
        parity,
        docs,
        doc-anchors,
        prune-caches,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report this workflow's outcome
        # The expression reaches the script through the environment rather than
        # being substituted into its text. Correct quoting is then not something
        # this step has to keep getting right: the shell never sees the
        # expression at all, so the rule that broke every one of these files --
        # an Actions expression takes single quotes only -- cannot be tripped
        # here again by an edit that looks harmless. It also keeps a value
        # GitHub interpolates out of the script body, which is the shape to
        # prefer wherever a value could ever be something other than a job
        # result.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependency results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a job this workflow covers reported '$r'"
                exit 1
                ;;
            esac
          done
          echo "every job this workflow covers succeeded or was skipped"
