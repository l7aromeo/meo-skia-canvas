name: Compile binaries
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux
          - mac
          - windows


permissions:
  contents: write
  packages: read

jobs:
  mac:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mac' }}
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test fixtures (PNGs, fonts) are tracked via Git LFS; without
          # this, `npm test` later in this job sees LFS pointer files
          # and bails on the first font/image decode.
          lfs: true

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Use Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      # Not seanmiddleditch/gha-setup-ninja: it still declares `using: node20`, which the runners
      # now force onto node24 and annotate as deprecated on every run. The Windows job below
      # already installs ninja through its package manager; this matches it.
      - name: Use Ninja
        run: brew install ninja

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build module
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.14
        run: just optimized

      - name: Add to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm test && npm run upload

  windows:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'x64' && 'windows-latest' || 'windows-11-arm' }}

    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test fixtures (PNGs, fonts) are tracked via Git LFS; without
          # this, `npm test` later in this job sees LFS pointer files
          # and bails on the first font/image decode.
          lfs: true

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Use Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install Ninja and just
        run: choco install ninja just

      - name: Build module
        run: just optimized

      - name: Add to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set script-shell bash
          npm test && npm run upload

  linux:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        libc: [glibc, musl]
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    # Pinned by digest, not `:latest`. The tag is mutable, so rebuilding the containers
    # silently changed the toolchain every later release was built with, and nothing
    # recorded which image produced which binary. `containers.yml` prints the digest to
    # pin in its run summary; update these two from there.
    #
    # Kept as an expression rather than a matrix `include`, which would merge into the
    # arch combinations instead of multiplying with them and quietly halve the job count.
    container:
      image: >-
        ${{ format('ghcr.io/{0}-{1}@{2}', github.repository, matrix.libc,
        matrix.libc == 'glibc'
        && 'sha256:ef7d103f57c63c7bf281125eafa210bf70890c65c9b6403ff4ec8757ecdae2c6'
        || 'sha256:dadd750bc47497b17f024c4fa64e1ea10cb2bb164f2e63523f9c6e89c151a17e') }}

    steps:
      - name: Install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo CARGO_TERM_COLOR=always >> $GITHUB_ENV

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Checkout skia-canvas
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        # Only `vendor/{freetype,zlib}` are needed to build, so they are
        # initialised explicitly rather than recursing over every
        # submodule. `vendor/{freetype,zlib}` get symlinked into
        # rust-skia's static-deps tree by the next step.
        run: |
          git clone --depth 1 --branch $REF ${SERVER}/${REPO} skia-canvas
          cd skia-canvas
          git submodule update --init --depth 1 vendor/freetype vendor/zlib
          # Fetch the LFS-tracked test fixtures so `npm test` can decode
          # them in the "Add to release" step below. `git-lfs` is baked
          # into the linux container images (see
          # `containers/Dockerfile.{glibc,musl}`). `git lfs install
          # --local` registers the smudge filter on this clone before
          # the pull -- without it, `git lfs pull` no-ops on the
          # pointer files and `npm test` still gets pointer text.
          git lfs install --local
          git lfs pull

      - name: Checkout rust-skia and apply static deps patch
        run: |
          export TAG=$(cd skia-canvas && just skia-version)
          git clone --depth 1 --branch $TAG --recurse-submodules -j8 https://github.com/rust-skia/rust-skia.git
          patch -d rust-skia -p1 -F10 < ./skia-canvas/containers/use-static-fontconfig.patch

      - name: Vendor Skia dependencies
        run: |
          mkdir -p rust-skia/skia-bindings/skia/third_party/externals
          ln -s $GITHUB_WORKSPACE/skia-canvas/vendor/freetype rust-skia/skia-bindings/skia/third_party/externals/freetype
          ln -s $GITHUB_WORKSPACE/skia-canvas/vendor/zlib rust-skia/skia-bindings/skia/third_party/externals/zlib

      - name: Build module
        run: |
          cd skia-canvas && just with-local-skia && just optimized

      # The glibc floor is invisible until someone tries to load the binary on an older system,
      # and it drifted from 2.28 to 2.35 without anyone noticing — which is why the AWS layer
      # below has never been loadable on Lambda (#7). Assert it so it cannot creep further while
      # nobody is looking; the ceiling comes down as part of fixing #7.
      - name: Check the glibc floor has not drifted
        if: ${{ matrix.libc == 'glibc' }}
        run: |
          set -euo pipefail
          MAX_ALLOWED=2.35

          if ! command -v objdump >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq binutils
          fi

          FOUND=$(objdump -p skia-canvas/lib/skia.node \
            | sed -n '/Version References/,/^$/p' \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)

          echo "highest required: GLIBC_$FOUND (ceiling $MAX_ALLOWED)"

          if [ "$(printf '%s\n%s\n' "$MAX_ALLOWED" "$FOUND" | sort -V | tail -1)" != "$MAX_ALLOWED" ]; then
            echo "::error::Binary requires GLIBC_$FOUND, above the $MAX_ALLOWED ceiling — systems below that fail to load rather than degrading. Lower the base image in containers/Dockerfile.glibc, or raise the ceiling deliberately and update the floor in docs/getting-started.md. See #7."
            exit 1
          fi

      - name: Add to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd skia-canvas && npm test && npm run upload

      - name: Add AWS layer to release
        if: ${{ matrix.libc == 'glibc' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SRC_DIR="$GITHUB_WORKSPACE/skia-canvas"
          export SRC_DIST="$SRC_DIR/$(cd $SRC_DIR; npm pack)"
          export LAYER_DIR="$GITHUB_WORKSPACE/layer"
          export LAYER_ZIP="$GITHUB_WORKSPACE/aws-lambda-${{ matrix.arch }}.zip"
          export PKG_VERSION=v$(cd $SRC_DIR; npm pkg get version | tr -d '"')

          mkdir -p $LAYER_DIR/nodejs
          cd $LAYER_DIR/nodejs && \
             npm install --ignore-scripts $SRC_DIST && \
             cp $SRC_DIR/lib/skia.node ./node_modules/meo-skia-canvas/lib
          cd $LAYER_DIR && \
             zip -r9 $LAYER_ZIP nodejs/node_modules
          gh release -R l7aromeo/meo-skia-canvas upload $PKG_VERSION $LAYER_ZIP --clobber
