name: Compile binaries
# Dispatched for a release, and run without uploading anywhere else, so that a
# change breaking only the release build fails within a day of landing rather
# than at the next release's preparation. Only a dispatch can upload: on the
# other two events `inputs` is empty, and every upload step below asks for a
# dispatch by name rather than trusting an empty input to read as false.
on:
  # What the release build compiles from that no other workflow builds: the
  # Linux build containers and their patches, the Skia tree and its check, the
  # dependency pins, the build script, and this file. `paths:` is the right
  # filter here, where check-workflow-gates refuses it for ci, rust-ci and docs:
  # no ruleset requires this workflow's checks, so a run it skips leaves
  # nothing waiting.
  pull_request:
    paths:
      - "containers/**"
      - "scripts/skia-source.mjs"
      - "scripts/check-patched-skia.mjs"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/build.yml"
  # Daily against `main`, off the hour, which GitHub's own scheduler crowds.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux
          - mac
          - windows
      # Off, a run builds and tests every leg it is asked for and posts nothing:
      # no binary, no Lambda layer, and the release for the version is neither
      # made nor touched. For timing or checking a build change on a branch,
      # whose binaries must not replace the draft's.
      upload:
        description: "Upload the binaries to the release"
        required: false
        default: true
        type: boolean

# Queued, never cancelled, except on a pull request. The jobs below upload to
# the release for the tag they were dispatched at, with `--clobber`, and the
# published package pins the sha256 of those assets -- so two runs overlapping
# on one tag can replace a binary that installs are already verifying against.
# Waiting is the safe failure; cancelling a run mid-upload is not. A pull
# request's run uploads nothing, so a newer push to it cancels the older run
# rather than queueing behind an hour of builds nobody will read.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default, elevated on the jobs that need it. Every job here
# happens to need `contents: write` today -- the three build legs upload assets,
# and `verify-lambda-layer` downloads one from a release that is still a draft,
# which a read-only token cannot see at all. The default is `read` regardless, so
# a job added later inherits the harmless permission rather than the release one.
permissions:
  contents: read

jobs:
  mac:
    # `inputs.platforms` is empty outside a dispatch, which builds everything.
    if: ${{ (inputs.platforms || 'all') == 'all' || inputs.platforms == 'mac' }}
    runs-on: macos-15
    # Uploads the built binary to the release.
    permissions:
      contents: write
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Stated rather than inherited. `bun-version` is declared
        # `required: false` with no `default:` in the action's manifest, so an
        # omitted value is not "latest" by definition -- the action falls
        # through to `bun-version-file`, `package.json`'s `packageManager`,
        # `.bun-version` and `.tool-versions`, none of which this repository
        # has, and lands on latest by internal fallback. Saying it keeps this
        # step agreeing with the six that already do, and stops a change to
        # that fallback order moving them apart with nothing to read.
        with:
          bun-version: latest

      - name: Use Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # Not seanmiddleditch/gha-setup-ninja: it still declares `using: node20`, which the runners
      # now force onto node24 and annotate as deprecated on every run. The Windows job below
      # already installs ninja through its package manager; this matches it.
      - name: Use Ninja
        run: brew install ninja

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # The patched Skia tree the macOS build compiles from -- rust-skia at the
      # Cargo.lock tag, Skia's DEPS and gn, and macOS's patches from `PATCHES`
      # in scripts/skia-source.mjs. `just build-release` prepares it when the
      # cache misses. The key is the tree's own name, which carries the version
      # and the patches' digest, so it follows both with no list here to keep
      # in step. Assigned before it is written out, so that a failing
      # `cache-key` fails the step.
      - name: Name the Skia source's cache key
        id: skia-key
        run: |
          key=$(node scripts/skia-source.mjs cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache the Skia source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/meo-skia-canvas
          key: ${{ steps.skia-key.outputs.key }}

      - name: Build module
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.14
        run: just build-release

      # A binary built against rust-skia's prebuilt Skia, or from an unpatched
      # tree, carries the one-second Metal compile timeout, the atlas that
      # can move a pixel of a path's coverage, the triangulation cache that
      # draws a curve by what the context drew before, and the read that
      # allocates a transfer buffer each time, and passes every test that does
      # not stall the compiler, land a path there or look at the buffer.
      # skia-bindings' build output says whether it built offline and names
      # each file ninja compiled, so this refuses a build that downloaded, or
      # whose `GrMtlUtil.mm`, `AtlasPathRenderer.cpp`,
      # `TriangulatingPathRenderer.cpp` or `SurfaceContext.cpp` is not the
      # patched one -- scripts/check-patched-skia.mjs says how.
      - name: Check Skia was built from the patched source
        run: node scripts/check-patched-skia.mjs target/release/build

      - name: Test the module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tests/suite/metal-compile.test.js fails rather than skips here for
          # a missing GPU engine or sandbox. It still skips on this runner's
          # Apple Paravirtual device, whose compiler service is shared and
          # cannot be stopped for one process; the step above is the proof
          # that holds there.
          MEO_SKIA_CANVAS_REQUIRE_METAL: "1"
          # The binary this job built. scripts/test.mjs falls back to an installed
          # platform package -- the published one -- when `lib/skia.node` is missing;
          # named here, lib/binary.js refuses a path that does not exist instead.
          MEO_SKIA_CANVAS_BINARY: ${{ github.workspace }}/lib/skia.node
        run: bun run test:suite

      - name: TEMPORARY COLR glyphs against Chrome's references
        env:
          MEO_SKIA_CANVAS_BINARY: ${{ github.workspace }}/lib/skia.node
        run: |
          sw_vers
          node .github/scripts/colr-measure.cjs

      - name: Add to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run upload

  windows:
    if: ${{ (inputs.platforms || 'all') == 'all' || inputs.platforms == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'x64' && 'windows-latest' || 'windows-11-arm' }}
    timeout-minutes: 120
    # Uploads the built binary to the release.
    permissions:
      contents: write

    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Stated rather than inherited. `bun-version` is declared
        # `required: false` with no `default:` in the action's manifest, so an
        # omitted value is not "latest" by definition -- the action falls
        # through to `bun-version-file`, `package.json`'s `packageManager`,
        # `.bun-version` and `.tool-versions`, none of which this repository
        # has, and lands on latest by internal fallback. Saying it keeps this
        # step agreeing with the six that already do, and stops a change to
        # that fallback order moving them apart with nothing to read.
        with:
          bun-version: latest

      - name: Use Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install Ninja and just
        run: choco install ninja just

      # skia-bindings compiles Skia with clang-cl from LLVM_HOME or
      # `C:\Program Files\LLVM`, and bindgen needs libclang from the same
      # place; without one it falls back to MSVC's `cl`. Installed only where
      # the image does not carry it.
      - name: Use LLVM
        shell: bash
        run: |
          if [ -x "/c/Program Files/LLVM/bin/clang-cl.exe" ]; then
            "/c/Program Files/LLVM/bin/clang-cl.exe" --version | head -1
          else
            choco install llvm --no-progress
          fi

      # The patched Skia tree the Windows build compiles from -- rust-skia at
      # the Cargo.lock tag, Skia's DEPS and gn, and Windows's patches from
      # `PATCHES` in scripts/skia-source.mjs. `just build-release` prepares it
      # when the cache misses; skia-source names it by version and patch
      # digest. The key is that name, from `cache-key`, so it follows both
      # with no list here to keep in step; bash, because the Windows runner's
      # default shell reads `key=$(...)` otherwise, and assigned before it is
      # written out so that a failing `cache-key` fails the step. Only the
      # source is cached: Skia itself is compiled on every run, as on macOS.
      - name: Name the Skia source's cache key
        id: skia-key
        shell: bash
        run: |
          key=$(node scripts/skia-source.mjs cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache the Skia source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/meo-skia-canvas
          key: ${{ steps.skia-key.outputs.key }}

      # Built with the Skia tree reached through a drive letter of its own.
      # ninja resolves every header clang-cl reports, and where the tree and
      # the target share a drive -- windows-11-arm checks out on C:, the
      # cache's drive -- gn writes the tree's paths relative to the out
      # directory, nine `../` deep, and ninja's resolution of a header there
      # passes 260 characters: "GetFullPathNameA(...): The filename or
      # extension is too long". On another drive gn keeps them absolute, at
      # most 173 characters here, as the x64 image's D: checkout does.
      # Windows' long-path switch did not lift it. `subst` is per logon
      # session, so it is made in the step that builds.
      - name: Build module
        shell: pwsh
        run: |
          if (Test-Path S:\) { throw "S: is taken; pick another letter for the Skia cache" }
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.cache" | Out-Null
          subst S: "$env:USERPROFILE\.cache"
          $env:XDG_CACHE_HOME = 'S:\'
          just build-release

      # The macOS job's check, for Windows's patches: rust-skia's prebuilt
      # Skia, or a build from an unpatched tree, links and passes every test
      # that does not land a path where the atlas moves a pixel, draw a curve
      # at two scales or ask for a face flagged oblique.
      # scripts/check-patched-skia.mjs refuses a build that downloaded, or
      # whose `AtlasPathRenderer.cpp`, `TriangulatingPathRenderer.cpp` or
      # `SkTypeface_win_dw.cpp` is not the patched one. It reads the compiled
      # files at the `S:` paths ninja named them by, so the drive is mapped
      # again where the build step's mapping did not outlive it.
      - name: Check Skia was built from the patched source
        shell: pwsh
        run: |
          if (-not (Test-Path S:\)) { subst S: "$env:USERPROFILE\.cache" }
          node scripts/check-patched-skia.mjs target/release/build

      - name: Test the module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The binary this job built, for the reason the macOS job gives.
          MEO_SKIA_CANVAS_BINARY: ${{ github.workspace }}/lib/skia.node
        run: bun run test:suite

      - name: TEMPORARY COLR glyphs against Chrome's references
        env:
          MEO_SKIA_CANVAS_BINARY: ${{ github.workspace }}/lib/skia.node
        run: node .github/scripts/colr-measure.cjs

      - name: Add to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run upload

  linux:
    if: ${{ (inputs.platforms || 'all') == 'all' || inputs.platforms == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        libc: [glibc, musl]
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    # Uploads the built binary and the Lambda layer; `packages: read` pulls the
    # digest-pinned build container from ghcr.
    permissions:
      contents: write
      packages: read
    # Pinned by digest, not `:latest`. The tag is mutable, so rebuilding the containers
    # silently changed the toolchain every later release was built with, and nothing
    # recorded which image produced which binary. `containers.yml` prints the digest to
    # pin in its run summary; update these two from there.
    #
    # Kept as an expression rather than a matrix `include`, which would merge into the
    # arch combinations instead of multiplying with them and quietly halve the job count.
    container:
      image: >-
        ${{ format('ghcr.io/{0}-{1}@{2}', github.repository, matrix.libc,
        matrix.libc == 'glibc'
        && 'sha256:5d4e879572bdac72a91825ba74aefe5f36ce702385a28265bd26fdbbb6a691ad'
        || 'sha256:8c73e35fb89744851bea012a638ac0b982cb397c30d4f634d3001672dc9f1eb3') }}

    steps:
      # `rustup-init` from the versioned archive rather than piping `sh.rustup.rs`,
      # which serves whatever rustup is current at the moment the job runs. The
      # `mac` and `windows` legs take their toolchain from a SHA-pinned action, so
      # this was the one leg of the three acquiring its installer from a moving
      # target -- and it is the leg that compiles the Linux binaries carrying the
      # glibc 2.28 and GLIBCXX 3.4.25 commitments.
      #
      # The toolchain is still `stable`, as on the other two legs. What is pinned
      # here is the installer, which is the question that was actually open: all
      # three legs already agreed on the toolchain and disagreed only on where the
      # thing that installs it came from.
      #
      # The published sha256 is checked rather than trusted. That file reads
      # `<hash> *./rustup-init`, so `sha256sum -c` verifies it in place with no
      # reformatting, and a mismatch aborts before anything is executed -- which
      # is the property a piped installer cannot offer at all.
      #
      # `RUSTUP_VERSION` is written here and again in `containers.yml`, which
      # pins the same installer for the ABI probe. `container-pins.yml`'s "The
      # two rustup pins agree" step reads both and fails when they differ, so
      # bump them together and the check will say so if you do not.
      #
      # It is not synchronous, which is the part worth knowing. That workflow
      # runs on its Monday schedule, on a dispatch, and after a container
      # rebuild -- not on a pull request touching this file. So a one-sided bump
      # merges green and is caught later, by a run that is not the one that made
      # the change.
      - name: Install rust
        env:
          RUSTUP_VERSION: "1.29.1"
          RUSTUP_TARGET: ${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}-unknown-linux-${{ matrix.libc == 'glibc' && 'gnu' || 'musl' }}
        run: |
          BASE="https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUSTUP_TARGET}"
          curl --proto '=https' --tlsv1.2 -sSf -O "${BASE}/rustup-init"
          curl --proto '=https' --tlsv1.2 -sSf -O "${BASE}/rustup-init.sha256"
          sha256sum -c rustup-init.sha256
          chmod +x rustup-init
          ./rustup-init -y --profile minimal --default-toolchain stable
          rm -f rustup-init rustup-init.sha256
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"

      # Fetched in the container rather than through `setup-bun`, like rust and
      # `just` below: this job runs inside the build image, and a curl install is
      # what was verified in both -- bun 1.4.3 runs on AlmaLinux 8 and on
      # Alpine/musl, the two bases these images are built from.
      #
      # The tag is named for the same reason `just` names one below: the version
      # that was verified against these two images and the version the installer
      # resolves are otherwise the same only until bun's next release. The
      # installer takes the tag as its first argument, and an exact one, so this
      # does not follow a release the way the `setup-bun` steps' `latest` does:
      # it is moved by hand to the newest release once that has been run on
      # both images.
      #
      # Weaker than the rust step above, which fetches a versioned binary and
      # checks its published sha256. bun publishes an installer script rather
      # than a per-target artifact with a digest beside it, so the version is
      # pinned and the bytes that install it are not.
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.3"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # `--tag` rather than letting the installer resolve the latest release.
      # Left to itself it asks the GitHub API and, on the x64 glibc runner and
      # only there, took the release object's `url` for its `tag_name`:
      #
      #   Tag:     https://api.github.com/repos/casey/just/releases/364478524
      #   Archive: .../download/https://api.github.com/...tar.gz
      #
      # which 404s. Three dispatches of this release hit it three times while
      # the other five linux jobs installed the same way without trouble, so it
      # is not luck running out. Naming the version skips the lookup that
      # misreads, and pins the tool a release is built with besides.
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to /usr/local/bin --tag 1.58.0
          just --version

      - name: Checkout skia-canvas
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The commit the run is for, fetched by its hash: on a pull request
        # that is the merge commit `actions/checkout` gives the other legs,
        # which no branch names, and on any event it is the commit the run
        # started at, wherever its ref has moved since. Only
        # `vendor/{freetype,zlib}` are needed to build, so they are
        # initialised explicitly rather than recursing over every
        # submodule. `vendor/{freetype,zlib}` get symlinked into
        # rust-skia's static-deps tree by the next step.
        run: |
          git init -q skia-canvas
          cd skia-canvas
          git remote add origin "${SERVER}/${REPO}"
          git fetch --depth 1 origin "$SHA"
          git checkout -q --detach FETCH_HEAD
          git submodule update --init --depth 1 vendor/freetype vendor/zlib

      - name: Checkout and patch rust-skia
        run: |
          # Assigned and exported separately: `export VAR=$(cmd)` takes its
          # status from `export`, so a failing `just skia-version` would go
          # unnoticed and clone an empty branch name instead.
          TAG=$(cd skia-canvas && just skia-version)
          export TAG
          git clone --depth 1 --branch "$TAG" --recurse-submodules -j8 https://github.com/rust-skia/rust-skia.git
          # Linux's patches from `PATCHES` in scripts/skia-source.mjs, applied by
          # the same code that patches a tree for `just`, in `PATCHES`'s order
          # and with `-F0`, so a hunk that no longer matches fails, naming its
          # patch, rather than being placed by guesswork. Under
          # `use-local-skia` the justfile names no tree of its own, so this
          # checkout is what skia-bindings builds.
          node skia-canvas/scripts/skia-source.mjs apply rust-skia

      - name: Vendor Skia dependencies
        run: |
          mkdir -p rust-skia/skia-bindings/skia/third_party/externals
          ln -s "$GITHUB_WORKSPACE/skia-canvas/vendor/freetype" rust-skia/skia-bindings/skia/third_party/externals/freetype
          ln -s "$GITHUB_WORKSPACE/skia-canvas/vendor/zlib" rust-skia/skia-bindings/skia/third_party/externals/zlib

      # fontconfig is linked statically from the image's /opt/skia-static-libs,
      # whose `libfontconfig.a` a `-L native=` path on RUSTFLAGS puts ahead of the
      # system directories, so skia-bindings' `-lfontconfig` resolves to the
      # static library even where a shared one is installed: in the glibc image
      # with `fontconfig-devel` added, the link takes `libfontconfig.so.1`
      # without the path and the static library with it. The image as built
      # carries no shared fontconfig, so today the path is a guard rather than
      # the difference. Appended, not set: the image's RUSTFLAGS carry the linker
      # and `-static-libstdc++` (glibc) or `-crt-static` (musl). freetype is Skia's own, embedded, which
      # skia-bindings no longer links from the system under `embed-freetype`
      # (rust-skia#1326, in 0.156.0). `src/bdf_stub.c` answers the BDF calls the
      # static fontconfig makes.
      - name: Build module
        run: |
          export RUSTFLAGS="${RUSTFLAGS:-} -L native=/opt/skia-static-libs"
          cd skia-canvas && just use-local-skia && just build-release

      # The macOS job's check, for Linux's patches: a build from an unpatched
      # rust-skia checkout links and passes every test that does not land a
      # path where the atlas moves a pixel. This checkout carries no crates.io
      # package hash, so skia-bindings does a full build from the tree inside
      # it and never tries a download -- scripts/check-patched-skia.mjs reads
      # that from its output, and refuses either kind of build whose
      # `AtlasPathRenderer.cpp`, `TriangulatingPathRenderer.cpp` or
      # `SurfaceContext.cpp` is not the patched one.
      - name: Check Skia was built from the patched source
        run: node skia-canvas/scripts/check-patched-skia.mjs skia-canvas/target/release/build

      # A link that missed the static library does not fail: it links the
      # shared one, and the ABI checks below read symbol versions, not NEEDED.
      - name: fontconfig and freetype are linked statically
        run: |
          # The glibc image is AlmaLinux (dnf), the musl one Alpine (apk).
          command -v objdump >/dev/null || dnf -y install binutils || apk add --no-cache binutils
          needed=$(objdump -p skia-canvas/lib/skia.node | awk '$1 == "NEEDED" { print $2 }')
          echo "$needed"
          if echo "$needed" | grep -E '^lib(fontconfig|freetype)\.'; then
            echo "::error::lib/skia.node needs a shared fontconfig or freetype; the static link from /opt/skia-static-libs did not take. See #59."
            exit 1
          fi

      # Two ceilings, and they fail identically at load: a glibc symbol newer than the target's,
      # or a libstdc++ one. Each is a support commitment, not a measurement: the *lowest* across
      # the platforms this project supports, so the binary loads on all of them.
      #
      #   RHEL / Rocky / Alma 8            glibc 2.28   GLIBCXX 3.4.25
      #   Ubuntu 20.04, Debian 11          glibc 2.31
      #   RHEL / Rocky / Alma 9            glibc 2.34   GLIBCXX 3.4.29
      #   AWS Lambda / Amazon Linux 2023   glibc 2.34   GLIBCXX 3.4.33
      #
      # The floor is invisible until someone loads the binary on one of them, which is how it
      # drifted to 2.35 and left the AWS layer below unloadable on every release (#7). Asserting
      # it here makes the promise checkable, and makes the build base an implementation detail:
      # any base satisfying this is fine, and swapping one cannot quietly break the commitment.
      # The ceiling moves only when the platforms supported do, never to what a base happens to
      # give.
      #
      # 3.4.25 looks impossibly tight for a C++20 build, and would be, except that gcc-toolset
      # links its newer libstdc++ statically and leaves only the old baseline symbols dynamic.
      # Measured on a real build: glibc 2.28, at its ceiling, since the base is AlmaLinux 8 and has
      # RHEL 8's glibc, and GLIBCXX 3.4.21, under its own.
      - name: Check the ABI floors have not drifted
        if: ${{ matrix.libc == 'glibc' }}
        run: |
          set -euo pipefail
          MAX_GLIBC=2.28
          MAX_GLIBCXX=3.4.25

          command -v objdump >/dev/null || dnf -y install binutils

          refs=$(objdump -p skia-canvas/lib/skia.node | sed -n '/Version References/,/^$/p')
          # `|| true` on the grep is load-bearing under `set -euo pipefail`. grep
          # exits 1 when it matches nothing, which fails the pipeline and so the
          # assignment, killing this step before it reaches the checks below --
          # including the `-z "$GLIBC"` guard that exists precisely for the case
          # where nothing was read. Without it that guard is unreachable and the
          # failure arrives as an empty step instead of its own error message.
          highest() { printf '%s' "$refs" | { grep -oE "$1"'_[0-9.]+' || true; } | sed "s/$1"'_//' | sort -V | tail -1; }
          exceeds() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" != "$1" ]; }

          GLIBC=$(highest GLIBC)
          GLIBCXX=$(highest GLIBCXX)
          echo "requires GLIBC_${GLIBC:-none} (ceiling $MAX_GLIBC), GLIBCXX_${GLIBCXX:-none} (ceiling $MAX_GLIBCXX)"

          fail=0
          # An empty read is not portability, it means this check stopped parsing the binary.
          if [ -z "$GLIBC" ]; then
            echo "::error::No GLIBC version references found at all — this check is no longer reading the binary. Investigate before trusting a pass."
            fail=1
          elif exceeds "$MAX_GLIBC" "$GLIBC"; then
            echo "::error::Binary requires GLIBC_$GLIBC, above the $MAX_GLIBC commitment — RHEL 8 is 2.28 and would fail to load rather than degrade. Lower the base image in containers/Dockerfile.glibc, or change the commitment deliberately and say so in docs/getting-started.md. See #7."
            fail=1
          fi
          if [ -n "$GLIBCXX" ] && exceeds "$MAX_GLIBCXX" "$GLIBCXX"; then
            echo "::error::Binary requires GLIBCXX_$GLIBCXX, above the $MAX_GLIBCXX commitment — RHEL 8 ships 3.4.25 and would fail to load. This usually means gcc-toolset stopped linking its newer libstdc++ statically; check the toolset and CC/CXX in containers/Dockerfile.glibc. See #7."
            fail=1
          fi

          # The check that matters most, and the one a version ceiling structurally cannot make.
          #
          # A build reported GLIBCXX_3.4.21 — under every ceiling above — and still failed to load:
          #
          #   undefined symbol: std::__cxx11::basic_string<...>::_M_replace_cold(...)
          #
          # _M_replace_cold arrived in GCC 12 and carries no GLIBCXX_ tag, so no version check can
          # see it. Symbol versions are not the contract; resolvability is.
          #
          # This container is AlmaLinux 8, so its own libstdc++ is exactly the oldest supported
          # platform's. Every undefined C++ symbol resolving against it *is* the RHEL 8 guarantee.
          #
          # Note libstdc++ legitimately stays in NEEDED: -static-libstdc++ absorbs the newer
          # symbols and leaves the baseline dynamic. Its presence is not the fault; an unresolvable
          # symbol is.
          # Then load it. This container is AlmaLinux 8, so its libstdc++ and glibc are exactly the
          # oldest platform claimed above — if dlopen succeeds here it succeeds on RHEL 8.
          #
          # A previous version of this compared nm's undefined list against the system libstdc++.
          # That is the same question asked indirectly, through two rounds of text parsing, and it
          # reported symbols missing that were demonstrably present. Loading the thing answers it
          # exactly, and catches unversioned symbols the ceilings above cannot see — which is how
          # a binary reporting GLIBCXX_3.4.21 still died on:
          #
          #   undefined symbol: std::__cxx11::basic_string<...>::_M_replace_cold(...)
          #
          # It has to load the binary this job built. `lib/binary.js` prefers an installed
          # platform package over `lib/skia.node`, and the dependency install puts the published
          # one in node_modules, so a bare `require` tests that instead. MEO_SKIA_CANVAS_BINARY
          # points the load at the build, and the check refuses to go on unless the one addon
          # in `require.cache` is that file -- checked before rendering, because 7.0's
          # JavaScript drawing through 6.0.2's binary throws first and would be reported as a
          # load failure. Requiring the module loads the addon. `require.cache` keys are
          # realpaths, hence `realpathSync`.
          built="$PWD/skia-canvas/lib/skia.node"
          # `|| status=$?` because the step's shell runs with -e.
          status=0
          MEO_SKIA_CANVAS_BINARY="$built" node -e "
                const built = require('fs').realpathSync(process.argv[1]);
                const {Canvas} = require('./skia-canvas/lib/index.js');
                const loaded = Object.keys(require.cache).filter((path) => path.endsWith('.node'));
                if (loaded.length !== 1 || loaded[0] !== built) {
                  console.error('loaded ' + JSON.stringify(loaded) + ', not ' + built);
                  process.exit(2);
                }
                const c = new Canvas(32, 32), x = c.getContext('2d');
                x.fillStyle = '#745557'; x.fillRect(0, 0, 32, 32);
                if (c.toBufferSync('png').length < 100) throw new Error('rendered nothing');
                console.log('loads and renders on the oldest supported platform: ' + built);
              " "$built" || status=$?
          case $status in
            0) ;;
            2) echo "::error::The load check loaded a binary other than the one this job built (named just above), so it says nothing about this build. lib/binary.js chooses which binary loads; MEO_SKIA_CANVAS_BINARY is what points it here. See #573."
               fail=1 ;;
            *) echo "::error::The binary does not load on AlmaLinux 8, the oldest platform this release claims. The version ceilings above passed, so this is an unversioned symbol they cannot see — read the dlopen error just above. Usually libstdc++: rustc links through cc by default, which ignores -static-libstdc++, so RUSTFLAGS in containers/Dockerfile.glibc must also set the linker to clang++. See #7."
               fail=1 ;;
          esac

          exit $fail

      - name: Test the module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The binary this job built, for the reason the macOS job gives. Set in the
        # script rather than through `env:`: in a container job `github.workspace`
        # names the runner's path, not the container's.
        run: cd skia-canvas && MEO_SKIA_CANVAS_BINARY="$PWD/lib/skia.node" bun run test:suite

      - name: TEMPORARY COLR glyphs against Chrome's references, FreeType
        run: cd skia-canvas && MEO_SKIA_CANVAS_BINARY="$PWD/lib/skia.node" node .github/scripts/colr-measure.cjs

      - name: TEMPORARY COLR glyphs against Chrome's references, own painter
        run: |
          cd skia-canvas
          export MEO_SKIA_CANVAS_BINARY="$PWD/lib/skia.node" MEO_COLR_OWN_ROUTE=1
          node .github/scripts/colr-measure.cjs
          node --test tests/suite/colour-fonts.test.js

      - name: Add to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd skia-canvas && bun run upload

      - name: Add AWS layer to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload && matrix.libc == 'glibc' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SRC_DIR="$GITHUB_WORKSPACE/skia-canvas"

          # The npm README and changelog, put in place by the script
          # `publish.yml` runs: this is a third place the tarball is built.
          (cd "$SRC_DIR" && node scripts/stage-npm-package.mjs)

          # Same reason as `TAG` above: assigned, then exported, so a failing
          # `npm pack` or `npm pkg get` is not masked by `export`.
          SRC_DIST="$SRC_DIR/$(cd "$SRC_DIR" && npm pack)"
          export SRC_DIST
          export LAYER_DIR="$GITHUB_WORKSPACE/layer"
          export LAYER_ZIP="$GITHUB_WORKSPACE/aws-lambda-${{ matrix.arch }}.zip"
          # `npm-v`, matching `NPM_TAG` in `lib/prebuild.mjs`, which is what
          # created the release these assets are uploaded to. This said `v`
          # and the upload failed with "release not found" -- the first
          # release cut under the new scheme was the first thing to run it.
          PKG_VERSION=npm-v$(cd "$SRC_DIR" && npm pkg get version | tr -d '"')
          export PKG_VERSION

          # `--omit=optional` keeps the platform packages out: one installed beside the
          # package outranks the `lib/skia.node` copied in below, so a layer holding one
          # would ship the published binary rather than this build.
          mkdir -p "$LAYER_DIR/nodejs"
          cd "$LAYER_DIR/nodejs" && \
             npm install --ignore-scripts --omit=optional "$SRC_DIST" && \
             cp "$SRC_DIR/lib/skia.node" ./node_modules/meo-skia-canvas/lib
          cd "$LAYER_DIR" && \
             zip -r9 "$LAYER_ZIP" nodejs/node_modules
          # Same guard as `ensureRelease` in lib/prebuild.mjs, for the same reason: this upload
          # passes --clobber, and a published release's assets are the ones the published npm
          # package pins by sha256. Replacing them fails the integrity check for every install
          # through the download fallback. A rebuild goes to a new version.
          if [ "$(gh release view "$PKG_VERSION" --json isDraft -q .isDraft \
                    -R l7aromeo/meo-skia-canvas)" = "false" ]; then
            echo "::error::Release $PKG_VERSION is already published -- refusing to replace its assets. The published package pins their sha256, so clobbering them breaks the integrity check for everyone installing through the download fallback. Bump the version and build that."
            exit 1
          fi
          gh release -R l7aromeo/meo-skia-canvas upload "$PKG_VERSION" "$LAYER_ZIP" --clobber

  # The AWS layer was published broken on every release from 3.6.0 onward and nothing noticed,
  # because nothing ever loaded it — build.yml zipped it and uploaded it, and that was the whole
  # lifecycle. Amazon publishes the Lambda runtime as a container image, so the real thing can be
  # tested in seconds without an AWS account.
  #
  # Separate job because the linux job runs *inside* the build container, where there is no docker.
  verify-lambda-layer:
    name: Verify the AWS layer loads on Lambda
    needs: linux
    # The layer it loads is one the linux job uploaded, which a run without
    # uploads never posts.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reads an asset off a release that is still a draft, and a draft is invisible
    # to a read-only token -- so this needs write to download, not to write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the layer just published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same scheme as the upload above and as `lib/prebuild.mjs`.
          TAG=npm-v$(node -p "require('./package.json').version")
          gh release -R l7aromeo/meo-skia-canvas download "$TAG" -p aws-lambda-x64.zip --clobber
          mkdir -p layer && unzip -q aws-lambda-x64.zip -d layer

      # Mounted at /opt because that is where Lambda mounts a layer, and required by module name
      # through NODE_PATH the way a function would resolve it.
      - name: Load it on the real Lambda runtime
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD/layer:/opt" \
            --entrypoint /bin/bash public.ecr.aws/lambda/nodejs:22 -c '
              set -e
              echo "runtime glibc: $(ldd --version | head -1)"
              NODE_PATH=/opt/nodejs/node_modules node -e "
                const {Canvas} = require(\"meo-skia-canvas\");
                // The binary the linux job copied into the layer, and no other: a
                // platform package in the layer would outrank it.
                const built = require(\"fs\").realpathSync(\"/opt/nodejs/node_modules/meo-skia-canvas/lib/skia.node\");
                const loaded = Object.keys(require.cache).filter((path) => path.endsWith(\".node\"));
                if (loaded.length !== 1 || loaded[0] !== built)
                  throw new Error(\"loaded \" + JSON.stringify(loaded) + \", not \" + built);
                const c = new Canvas(64, 32), x = c.getContext(\"2d\");
                x.fillStyle = \"#745557\"; x.fillRect(0, 0, 64, 32);
                const png = c.toBufferSync(\"png\");
                if (png.length < 100) throw new Error(\"suspiciously small render\");
                console.log(\"layer loaded and rendered\", png.length, \"bytes\");
              "
            '
