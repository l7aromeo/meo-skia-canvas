name: Compile binaries
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux
          - mac
          - windows


permissions:
  contents: write
  packages: read

jobs:
  mac:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mac' }}
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test fixtures (PNGs, fonts) are tracked via Git LFS; without
          # this, `npm test` later in this job sees LFS pointer files
          # and bails on the first font/image decode.
          lfs: true

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Use Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      # Not seanmiddleditch/gha-setup-ninja: it still declares `using: node20`, which the runners
      # now force onto node24 and annotate as deprecated on every run. The Windows job below
      # already installs ninja through its package manager; this matches it.
      - name: Use Ninja
        run: brew install ninja

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build module
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.14
        run: just optimized

      - name: Add to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm test && npm run upload

  windows:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'x64' && 'windows-latest' || 'windows-11-arm' }}

    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test fixtures (PNGs, fonts) are tracked via Git LFS; without
          # this, `npm test` later in this job sees LFS pointer files
          # and bails on the first font/image decode.
          lfs: true

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Use Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install Ninja and just
        run: choco install ninja just

      - name: Build module
        run: just optimized

      - name: Add to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set script-shell bash
          npm test && npm run upload

  linux:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        libc: [glibc, musl]
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    # Pinned by digest, not `:latest`. The tag is mutable, so rebuilding the containers
    # silently changed the toolchain every later release was built with, and nothing
    # recorded which image produced which binary. `containers.yml` prints the digest to
    # pin in its run summary; update these two from there.
    #
    # Kept as an expression rather than a matrix `include`, which would merge into the
    # arch combinations instead of multiplying with them and quietly halve the job count.
    container:
      image: >-
        ${{ format('ghcr.io/{0}-{1}@{2}', github.repository, matrix.libc,
        matrix.libc == 'glibc'
        && 'sha256:c6366ca22b7c60270c93bdbb6c9093f47110e7a3472bd551704663f589e6fbea'
        || 'sha256:a30af0cdf4bfe49eabb210768ab30aaec264619c06cadf8e8501f3d2b6cbf2e6') }}

    steps:
      - name: Install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo CARGO_TERM_COLOR=always >> $GITHUB_ENV

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Checkout skia-canvas
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        # Only `vendor/{freetype,zlib}` are needed to build, so they are
        # initialised explicitly rather than recursing over every
        # submodule. `vendor/{freetype,zlib}` get symlinked into
        # rust-skia's static-deps tree by the next step.
        run: |
          git clone --depth 1 --branch $REF ${SERVER}/${REPO} skia-canvas
          cd skia-canvas
          git submodule update --init --depth 1 vendor/freetype vendor/zlib
          # Fetch the LFS-tracked test fixtures so `npm test` can decode
          # them in the "Add to release" step below. `git-lfs` is baked
          # into the linux container images (see
          # `containers/Dockerfile.{glibc,musl}`). `git lfs install
          # --local` registers the smudge filter on this clone before
          # the pull -- without it, `git lfs pull` no-ops on the
          # pointer files and `npm test` still gets pointer text.
          git lfs install --local
          git lfs pull

      - name: Checkout rust-skia and apply static deps patch
        run: |
          export TAG=$(cd skia-canvas && just skia-version)
          git clone --depth 1 --branch $TAG --recurse-submodules -j8 https://github.com/rust-skia/rust-skia.git
          patch -d rust-skia -p1 -F10 < ./skia-canvas/containers/use-static-fontconfig.patch

      - name: Vendor Skia dependencies
        run: |
          mkdir -p rust-skia/skia-bindings/skia/third_party/externals
          ln -s $GITHUB_WORKSPACE/skia-canvas/vendor/freetype rust-skia/skia-bindings/skia/third_party/externals/freetype
          ln -s $GITHUB_WORKSPACE/skia-canvas/vendor/zlib rust-skia/skia-bindings/skia/third_party/externals/zlib

      - name: Build module
        run: |
          cd skia-canvas && just with-local-skia && just optimized

      # 2.34 is a support commitment, not a measurement. It is the glibc of the two platforms this
      # project has to clear, both supported for years yet frozen by design:
      #
      #   AWS Lambda / Amazon Linux 2023   2.34   supported to 2028
      #   RHEL / Rocky / Alma 9            2.34   supported to 2032
      #
      # The floor is invisible until someone loads the binary on one of them, which is how it
      # drifted to 2.35 and left the AWS layer below unloadable on every release (#7). Asserting
      # it here makes the promise checkable, and makes the build base an implementation detail:
      # any base satisfying this is fine, and swapping one cannot quietly break the commitment.
      #
      # AlmaLinux 8 currently gives 2.28, so this passes with margin. The margin is deliberate:
      # tightening the assertion to whatever the base happens to allow would fail the build on any
      # future base that still honours every promise above.
      # Two things to hold, and they fail identically at load: a glibc symbol newer than the
      # target's, or a libstdc++ one.
      #
      # glibc has a ceiling because the base image sets it. libstdc++ must be absent entirely —
      # RUSTFLAGS in containers/Dockerfile.glibc links it statically, because the versions on the
      # supported platforms (RHEL 8 3.4.25, RHEL 9 3.4.29, Lambda 3.4.33) are older than any
      # toolchain new enough to compile Skia's C++20. Any GLIBCXX reference here means that
      # linkage silently stopped working.
      - name: Check the ABI floors have not drifted
        if: ${{ matrix.libc == 'glibc' }}
        run: |
          set -euo pipefail
          MAX_GLIBC=2.34

          command -v objdump >/dev/null || dnf -y install binutils

          refs=$(objdump -p skia-canvas/lib/skia.node | sed -n '/Version References/,/^$/p')
          highest() { printf '%s' "$refs" | grep -oE "$1"'_[0-9.]+' | sed "s/$1"'_//' | sort -V | tail -1; }
          exceeds() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" != "$1" ]; }

          GLIBC=$(highest GLIBC)
          GLIBCXX=$(highest GLIBCXX)
          echo "requires GLIBC_${GLIBC:-none} (ceiling $MAX_GLIBC), GLIBCXX_${GLIBCXX:-none} (expected: none)"

          fail=0
          if [ -z "$GLIBC" ]; then
            echo "::error::No GLIBC version references found at all. That is not portability, it means this check stopped reading the binary — investigate before trusting it."
            fail=1
          elif exceeds "$MAX_GLIBC" "$GLIBC"; then
            echo "::error::Binary requires GLIBC_$GLIBC, above the $MAX_GLIBC commitment — AWS Lambda and RHEL 9 are both 2.34 and would fail to load rather than degrade. Lower the base image in containers/Dockerfile.glibc, or change the commitment deliberately and say so in docs/getting-started.md. See #7."
            fail=1
          fi
          if [ -n "$GLIBCXX" ]; then
            echo "::error::Binary requires GLIBCXX_$GLIBCXX; it should require none. libstdc++ is meant to be linked statically via RUSTFLAGS in containers/Dockerfile.glibc. Dynamically linked, this needs a libstdc++ newer than RHEL 8 (3.4.25) or RHEL 9 (3.4.29) ship. See #7."
            fail=1
          fi
          exit $fail

      - name: Add to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd skia-canvas && npm test && npm run upload

      - name: Add AWS layer to release
        if: ${{ matrix.libc == 'glibc' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SRC_DIR="$GITHUB_WORKSPACE/skia-canvas"
          export SRC_DIST="$SRC_DIR/$(cd $SRC_DIR; npm pack)"
          export LAYER_DIR="$GITHUB_WORKSPACE/layer"
          export LAYER_ZIP="$GITHUB_WORKSPACE/aws-lambda-${{ matrix.arch }}.zip"
          export PKG_VERSION=v$(cd $SRC_DIR; npm pkg get version | tr -d '"')

          mkdir -p $LAYER_DIR/nodejs
          cd $LAYER_DIR/nodejs && \
             npm install --ignore-scripts $SRC_DIST && \
             cp $SRC_DIR/lib/skia.node ./node_modules/meo-skia-canvas/lib
          cd $LAYER_DIR && \
             zip -r9 $LAYER_ZIP nodejs/node_modules
          gh release -R l7aromeo/meo-skia-canvas upload $PKG_VERSION $LAYER_ZIP --clobber

  # The AWS layer was published broken on every release from 3.6.0 onward and nothing noticed,
  # because nothing ever loaded it — build.yml zipped it and uploaded it, and that was the whole
  # lifecycle. Amazon publishes the Lambda runtime as a container image, so the real thing can be
  # tested in seconds without an AWS account.
  #
  # Separate job because the linux job runs *inside* the build container, where there is no docker.
  verify-lambda-layer:
    name: Verify the AWS layer loads on Lambda
    needs: linux
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the layer just published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v$(node -p "require('./package.json').version")
          gh release -R l7aromeo/meo-skia-canvas download "$TAG" -p aws-lambda-x64.zip --clobber
          mkdir -p layer && unzip -q aws-lambda-x64.zip -d layer

      # Mounted at /opt because that is where Lambda mounts a layer, and required by module name
      # through NODE_PATH the way a function would resolve it.
      - name: Load it on the real Lambda runtime
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD/layer:/opt" \
            --entrypoint /bin/bash public.ecr.aws/lambda/nodejs:22 -c '
              set -e
              echo "runtime glibc: $(ldd --version | head -1)"
              NODE_PATH=/opt/nodejs/node_modules node -e "
                const {Canvas} = require(\"meo-skia-canvas\");
                const c = new Canvas(64, 32), x = c.getContext(\"2d\");
                x.fillStyle = \"#745557\"; x.fillRect(0, 0, 64, 32);
                const png = c.toBufferSync(\"png\");
                if (png.length < 100) throw new Error(\"suspiciously small render\");
                console.log(\"layer loaded and rendered\", png.length, \"bytes\");
              "
            '
