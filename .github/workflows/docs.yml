name: Docs

# The JavaScript reference: gated on every pull request, and published once per
# release rather than once per commit.
#
# Two things were missing and this does both. Nothing ran TypeDoc in CI at all --
# `just ci` builds it, and no workflow did -- so a dead link, or a type reaching a
# signature without being exported, was caught only by whoever happened to run the
# full gate before pushing. And there was nowhere to read the reference for a
# version you might actually have installed.
#
# `latest/` follows the newest published release, not `main`. A reference that
# tracked the branch would describe methods that are not in anyone's
# `node_modules` yet, which is worse than describing none: the reader has no way
# to tell which half of the page they can call. Every release keeps its own copy
# at `vX.Y.Z/`, so a project pinned to an older one still has its documentation.
#
# Only the JavaScript half is built. TypeDoc reads `lib/*.d.ts` and needs no
# native module, so a build is about a minute; `cargo doc` needs a full Skia
# build, and docs.rs already publishes that from the crate's own doc comments,
# per version, for nothing.
on:
  # The GitHub release being published, rather than its tag being pushed.
  #
  # `just release-npm` pushes the tag and then leaves a *draft* release, and
  # the binaries are compiled and the package published afterwards -- so a tag
  # exists for the best part of an hour before anyone can install what it
  # names. Triggering on the tag put a version in `latest/` that `npm install`
  # would not yet give you, which is the confusion this whole arrangement is
  # meant to prevent, only narrower. `just publish-npm` undrafts the release as
  # its first step, so this now fires minutes ahead of the package rather than
  # an hour.
  #
  # The cost, stated because it is real: a release that is tagged and then
  # abandoned before `publish-npm` gets no documentation at all, where the tag
  # trigger would have published some. That is the better failure -- nothing,
  # rather than a page for a version nobody can install.
  #
  # npm releases only. The reference is generated from `lib/*.d.ts`, which is
  # the npm package's surface -- `rust-v*` moves the crate and cannot change it,
  # and does not create a release here.
  release:
    types: [published]
  pull_request:
    paths:
      - "lib/**"
      - "scripts/typedoc/**"
      - ".github/workflows/docs.yml"
  # Backfills a version whose tag was pushed before this workflow existed, and
  # reruns one whose build failed. Publishing an older tag does not move
  # `latest/` unless it really is the newest published.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v5.5.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One publish at a time, and never cancelled: the site is rebuilt from the
  # `gh-pages` store and pushed back to it, so two runs racing would have one
  # of them write a site assembled from a store the other had already moved.
  # Pull requests build nothing shared and may cancel freely.
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'docs-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: reference (typedoc)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.which.outputs.version }}
    steps:
      - id: which
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) TAG="${{ inputs.tag }}" ;;
            release)           TAG="${{ github.event.release.tag_name }}" ;;
            *)                 TAG="" ;;
          esac

          if [ -n "$TAG" ] && ! printf '%s' "$TAG" \
              | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            # A prerelease is a real release event and not a version this site
            # keeps a directory for, so it is skipped rather than failed --
            # a red run on every `-rc` would teach everyone to ignore the red.
            # A dispatch is someone typing, so that is an error.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::'$TAG' is not a release tag (expected vX.Y.Z)"
              exit 1
            fi
            echo "::notice::$TAG is not a release version; nothing published"
            TAG=""
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag being published, or the pull request's head. `ref` with an
          # empty string is the default checkout, which is what a pull request
          # wants.
          ref: ${{ steps.which.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The root install as well as the tool's own. The declarations name
      # `Buffer` and import from `stream`, so TypeDoc needs `@types/node`, and
      # that lives in the root `node_modules` rather than in the tool's. Only
      # the types are wanted, so nothing is built: `--ignore-scripts` skips the
      # binary download this package's install would otherwise do.
      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd scripts/typedoc --frozen-lockfile

      # Fails on a structural finding -- a link that resolves to nothing, or a
      # type used in a signature without being exported -- and ratchets on
      # undocumented members, which are at zero. See scripts/typedoc/build.mjs.
      - name: Build the reference
        run: node scripts/typedoc/build.mjs

      # The ratchet rewrites its baseline when the count falls, which is a
      # change to a tracked file a publish would otherwise carry silently. It
      # cannot fire at a baseline of zero, and the assertion costs a line.
      - name: Check the baseline did not move
        run: git diff --exit-code scripts/typedoc/undocumented-baseline.txt

      - name: Keep the reference
        if: steps.which.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference
          path: target/jsdoc
          retention-days: 1

  publish:
    name: publish ${{ needs.build.outputs.version }}
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reference
          path: incoming

      # `gh-pages` is the store, not the served branch -- Pages is set to build
      # from a workflow. Keeping the accumulated site in a branch is what lets
      # one run add a version without rebuilding every earlier one, which is
      # the alternative and grows with every release.
      #
      # Fetched by hand rather than with `actions/checkout`, because the branch
      # does not exist before the first publish and there is no way to ask that
      # action for "this ref, or nothing". Letting it fail and carrying on was
      # the first attempt and was worse than useless: it leaves an initialised
      # `.git` behind on the way out, so a later test for one finds a repository
      # whose HEAD is on no branch at all, and the push then reports
      # `src refspec gh-pages does not match any`.
      - name: Fetch the store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q site
          cd site
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git fetch -q --depth=1 origin gh-pages; then
            git checkout -q -B gh-pages FETCH_HEAD
            echo "store: $(git rev-parse --short HEAD)"
          else
            git checkout -q -B gh-pages
            echo "store: empty, first publish"
          fi

      - name: Assemble the site
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Jekyll would otherwise skip anything TypeDoc names with a leading
          # underscore, and skip it silently.
          touch site/.nojekyll
          rm -rf "site/${VERSION}"
          cp -r incoming "site/${VERSION}"

          # `latest` follows the newest version present, which is not
          # necessarily the one just built: backfilling v5.4.0 after v5.5.0
          # must not demote the reference everyone reads.
          NEWEST=$(ls -1 site | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1.2,1n -k2,2n -k3,3n | tail -1)
          rm -rf site/latest
          cp -r "site/${NEWEST}" site/latest
          printf '%s\n' "${NEWEST}" > site/latest/VERSION

          node repo/scripts/typedoc/site-index.mjs site

      - name: Record it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Republishing an unchanged tag is a no-op rather than a failure.
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -q -m "docs: ${VERSION}"
          # `HEAD:gh-pages` rather than the branch name, so the push says what
          # it means whatever the local branch ended up called.
          git push -q origin HEAD:gh-pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
