name: Run tests

# Weekly rather than per-pull-request. This rebuilds the native module from source across six
# OS/Node combinations, which is far too slow to gate a review on — ci.yml covers Linux, macOS and
# Windows in about a minute each against the artifact users actually install.
#
# What this catches that ci.yml cannot is the toolchain drifting out from under a from-source
# build, which is not tied to our commits and so does not need a commit to trigger it. Its first
# ever run found three such problems at once: no Linux build dependencies, Skia M150 failing on
# libstdc++ 12, and a deprecated action runtime.
on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC. Cron in GitHub Actions is best-effort and can be delayed under load.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: test-matrix
  cancel-in-progress: false

jobs:
  run-tests:
    name: Rebuild & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          # 24.04, not 22.04. Skia M150 uses `std::views::reverse` in SkPDFTag.cpp, and the
          # libstdc++ 12 that ships with 22.04 cannot satisfy its constraints — the build dies with
          # six template errors before it links. The release binaries are unaffected because
          # Dockerfile.glibc installs clang 21 on bookworm, which is why build.yml stayed green
          # while this was broken. Building from source on 22.04 does not work at M150.
          - ubuntu-24.04
        # The floor from `engines` and the current active LTS. Node 20 reached end-of-life on
        # 2026-04-30; testing it would only prove an unsupported runtime still happens to work.
        node:
          - 22
          - 24

    steps:
      - name: Enable long paths (Windows only)
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Use Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Installed per-OS rather than through seanmiddleditch/gha-setup-ninja, which still declares
      # `using: node20` and so raises a deprecation annotation on every run. rust-ci.yml already
      # installs ninja this way; this drops a third-party action rather than waiting on it.
      #
      # The Linux packages were missing entirely, which is why both Linux jobs failed on the first
      # run this workflow ever had: Skia's SkFontConfigInterface_direct.h needs fontconfig headers.
      - name: Install build dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig1-dev libssl-dev nasm ninja-build pkg-config python3

      - name: Install build dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install ninja

      - name: Install build dependencies (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: choco install ninja nasm

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build module
        run: just build-release

      # Pinned to the build above. `just build-release` depends on `ensure-deps`,
      # which installs the optional platform packages, and those win resolution
      # over lib/skia.node -- so without this the suite exercises the published
      # binary and this workflow's whole subject, the from-source build, goes
      # untested while reporting green. `rust-ci.yml` and `ci.yml` both set it;
      # this was the one that did not.
      #
      # It hid behind the release cycle rather than being intermittent.
      # `release-npm` strips `optionalDependencies` before tagging and
      # `publish-npm` commits them back after, so main carries the pins between
      # releases -- nine days for v5.8.0, against the hours of the release
      # window. A weekly run therefore lands in the state where the override
      # matters, and a run during a release lands in the one where it does not.
      - name: Run tests
        env:
          MEO_SKIA_CANVAS_BINARY: ${{ github.workspace }}/lib/skia.node
        run: |
          bun run test
