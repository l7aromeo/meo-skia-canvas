name: Run tests
on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  run-tests:
    name: Rebuild & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          # 24.04, not 22.04. Skia M150 uses `std::views::reverse` in SkPDFTag.cpp, and the
          # libstdc++ 12 that ships with 22.04 cannot satisfy its constraints — the build dies with
          # six template errors before it links. The release binaries are unaffected because
          # Dockerfile.glibc installs clang 21 on bookworm, which is why build.yml stayed green
          # while this was broken. Building from source on 22.04 does not work at M150.
          - ubuntu-24.04
        # The floor from `engines` and the current active LTS. Node 20 reached end-of-life on
        # 2026-04-30; testing it would only prove an unsupported runtime still happens to work.
        node:
          - 22
          - 24

    steps:
      - name: Enable long paths (Windows only)
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Image and font fixtures live in LFS; without this they check out as pointer text and
          # every decode test fails for a reason that looks nothing like the cause.
          lfs: true

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Use Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Use Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build module
        run: just optimized

      - name: Run tests
        run: |
          npm test
