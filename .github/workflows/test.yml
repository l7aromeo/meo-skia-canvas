name: Run tests
on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  run-tests:
    name: Rebuild & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-22.04
        node:
          - 18
          - 24

    steps:
      - name: Enable long paths (Windows only)
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Image and font fixtures live in LFS; without this they check out as pointer text and
          # every decode test fails for a reason that looks nothing like the cause.
          lfs: true

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Use Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build module
        run: just optimized

      - name: Run tests
        run: |
          npm test
