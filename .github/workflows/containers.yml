name: Build containers
on:
  workflow_dispatch:

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        libc: [glibc, musl]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:latest` stays for convenience, but the commit-stamped tag is the one worth
      # referencing: `latest` is mutable, so nothing recorded which image produced which
      # release binary.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.libc }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.libc }}:${{ github.sha }}
          context: containers
          file: containers/Dockerfile.${{ matrix.libc }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          # `mode=max` caches every intermediate layer of a two-platform build. That was
          # 3.8 GB across 62 entries against a 10 GB per-repository limit, evicting the
          # Rust caches that cost 11-34 minutes to rebuild. `min` keeps only what is
          # needed to reuse the final image.
          cache-to: type=gha,mode=min
          push: true

      # Printed so `build.yml`'s digest pin can be updated from the run that produced it.
      - name: Report the digest to pin
        run: |
          echo "### ${{ matrix.libc }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}-${{ matrix.libc }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
