name: Build containers

# These images are the toolchain that compiles the released Linux binaries, and nothing else in CI
# touches them: ci.yml downloads a prebuilt binary, and build.yml is dispatch-only. So a Dockerfile
# change used to reach the binaries users install without ever having been built. Pull requests now
# build the images without pushing, which is the check a Dependabot base-image bump needs.
#
# The push trigger is what closes the other half. Without it a merged Dockerfile change never
# rebuilt `:latest`, so the pin in build.yml and the tag it is compared against went stale together
# -- and container-pins.yml, which asks only whether those two agree, passed while every release
# was built on the previous toolchain. Nothing announced it, because the check it would have to
# fail is the one that says they match.
#
# The consequence is intended and is not a regression: a merge that changes these images pushes a
# new `:latest`, the pin in build.yml is then genuinely stale, and container-pins.yml fails on the
# `workflow_run` that follows. That failure is the drift becoming visible at the moment it is
# created rather than at the next release, and it clears by updating the pin from the digest this
# workflow prints.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "containers/**"
      - ".github/workflows/containers.yml"
  pull_request:
    paths:
      - "containers/**"
      - ".github/workflows/containers.yml"

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-container:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # `permissions` takes no expressions, so this stays `write` and the push itself is what is
      # gated below. A pull request from a fork gets a read-only token regardless.
      packages: write
    strategy:
      matrix:
        libc: [glibc, musl]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:latest` stays for convenience, but the commit-stamped tag is the one worth
      # referencing: `latest` is mutable, so nothing recorded which image produced which
      # release binary.
      #
      # A pull request builds amd64 only. arm64 goes through QEMU emulation, which roughly
      # triples the job for a check whose purpose is "does this Dockerfile still work" —
      # a broken base image breaks both architectures the same way.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.libc }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.libc }}:${{ github.sha }}
          context: containers
          file: containers/Dockerfile.${{ matrix.libc }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          cache-from: type=gha
          # `mode=max` caches every intermediate layer of a two-platform build. That was
          # 3.8 GB across 62 entries against a 10 GB per-repository limit, evicting the
          # Rust caches that cost 11-34 minutes to rebuild. `min` keeps only what is
          # needed to reuse the final image.
          cache-to: type=gha,mode=min
          push: ${{ github.event_name != 'pull_request' }}
          # On a pull request nothing is pushed, so the image exists only in the
          # builder unless it is loaded into the local daemon -- which the ABI
          # probe below needs in order to run inside it. `load` requires a single
          # platform, which a pull request already builds.
          load: ${{ github.event_name == 'pull_request' }}

      # The ABI floors are otherwise asserted only in build.yml, which is
      # workflow_dispatch-only, so a change to containers/Dockerfile.glibc -- a
      # base image bump, a different gcc-toolset, an edited RUSTFLAGS -- reaches
      # a release without any pull request having checked it. Dependabot base
      # bumps are exactly that shape.
      #
      # This checks the TOOLCHAIN's floor, not the artifact's, and the difference
      # is not a caveat to gloss: our own code or a dependency introducing a newer
      # C++ symbol needs the real build and is not covered here. build.yml remains
      # the authority. What is covered is every way the container itself can raise
      # the floor, which is the axis a pull request actually moves.
      #
      # Verified against the shipped image rather than reasoned about: it passes
      # as configured, and it fails when RUSTFLAGS loses `-C linker=clang++`,
      # reporting the undefined `_M_replace_cold` that is the documented
      # historical regression. Dropping `-static-libstdc++` while keeping the
      # clang++ linker passes, correctly -- that output still resolves against
      # /lib64/libstdc++.so.6, which is AlmaLinux 8's own and therefore the RHEL 8
      # guarantee.
      #
      # Runs on every event, not only on a pull request. Restricted to pull
      # requests it probed only images that are thrown away: a dispatch is what
      # pushes `:latest` and what build.yml then pins, so the image that
      # compiles released binaries was the one image never checked.
      #
      # How the image is named differs by event and cannot be shared. A pull
      # request `load`s a single-platform build into the local daemon, so it is
      # reachable by tag and nothing is pushed. A dispatch pushes a two-platform
      # manifest and loads nothing, so it is reachable only by the digest the
      # build step reports -- and `--platform` then selects a manifest from that
      # list, which is what makes arm64 reachable at all. QEMU is already set up
      # above for the build.
      #
      # arm64 is probed only on a dispatch because a pull request does not build
      # it: emulating it there triples a check whose purpose is "does this
      # Dockerfile still work". The floors are a release-time commitment, and a
      # dispatch is release time.
      #
      # musl is deliberately absent, and widening the condition would not add it.
      # `abi-probe.sh` reads GLIBC and GLIBCXX version references out of
      # `objdump -p` and fails when it finds no GLIBC symbols at all -- "this
      # probe is no longer reading its own output", which is the right refusal
      # for a glibc image and the wrong one for musl, which has no symbol
      # versioning to read. Covering musl needs different assertions, not this
      # step with a looser `if`.
      # The installer is fetched from the versioned archive and its published
      # sha256 checked, rather than piped from `sh.rustup.rs`, which serves
      # whatever rustup is current at the moment the job runs. `build.yml` does
      # the same for the same reason; the two files agree deliberately.
      #
      # A digest is what a piped installer cannot offer at all: `rustup-init.sha256`
      # reads `<hash> *./rustup-init`, so `sha256sum -c` verifies it in place with
      # no reformatting and a mismatch aborts before anything is executed.
      #
      # The target is resolved from `uname -m` inside the container rather than
      # from a matrix value, because this step runs the probe under `docker run
      # --platform` and the architecture is the container's, not the runner's.
      # `uname -m` reports exactly the strings the archive is keyed by, `x86_64`
      # and `aarch64`, and `-unknown-linux-gnu` is fixed because this step only
      # ever runs against the glibc image.
      #
      # `--default-toolchain stable` is named rather than left to the installer's
      # default, which is what the mac and windows legs get from their pinned
      # action. Pinning the installer and leaving the toolchain implicit would
      # move the open question rather than close it.
      - name: The toolchain in this image still clears the ABI floors
        if: ${{ matrix.libc == 'glibc' }}
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}-glibc:{1}', github.repository, github.sha) || format('ghcr.io/{0}-glibc@{1}', github.repository, steps.build.outputs.digest) }}
          PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64 linux/arm64' }}
          RUSTUP_VERSION: "1.29.1"
        run: |
          for platform in $PLATFORMS; do
            echo "::group::${platform}"
            docker run --rm --platform "$platform" \
              -e RUSTUP_VERSION \
              -v "$PWD/containers/abi-probe.sh:/abi-probe.sh:ro" \
              "$IMAGE" \
              bash -lc '
                set -euo pipefail
                cd /tmp
                BASE="https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/$(uname -m)-unknown-linux-gnu"
                curl --proto "=https" --tlsv1.2 -sSf -O "${BASE}/rustup-init"
                curl --proto "=https" --tlsv1.2 -sSf -O "${BASE}/rustup-init.sha256"
                sha256sum -c rustup-init.sha256
                chmod +x rustup-init
                ./rustup-init -y --profile minimal --default-toolchain stable >/dev/null
                rm -f rustup-init rustup-init.sha256
                export PATH="$HOME/.cargo/bin:$PATH"
                bash /abi-probe.sh
              '
            echo "::endgroup::"
          done

      # Printed so `build.yml`'s digest pin can be updated from the run that produced it.
      - name: Report the digest to pin
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "### ${{ matrix.libc }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}-${{ matrix.libc }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Built, not pushed
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Built ${{ matrix.libc }} for linux/amd64. Nothing pushed; merge and dispatch this workflow to publish." >> "$GITHUB_STEP_SUMMARY"
