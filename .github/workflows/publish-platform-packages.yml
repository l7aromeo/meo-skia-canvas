name: Publish platform packages to NPM

# Republishes the prebuilt binaries already attached to the GitHub release as one npm package per
# target, so a package manager can select the right one from `os`/`cpu`/`libc` instead of running
# an install script to download it.
#
# The release is still a draft when this runs: `just publish-npm` publishes it only once these
# packages and the pins to them are in place, so that a failure here leaves nothing about the
# release public (#620).
#
# Must run before "Publish to NPM": the main package pins these by exact version, and publishing it
# first would briefly point at versions that do not exist yet.
run-name: >-
  ${{ inputs.dry_run && 'platform packages — DRY RUN (nothing is published)'
  || 'platform packages — publish' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stage and validate every target — do not publish"
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-platform
  cancel-in-progress: false

jobs:
  targets:
    name: Enumerate targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Assigned first, then echoed. `echo "x=$(cmd)"` exits 0 even when cmd fails, so a crash here
      # wrote an empty value, fromJSON produced no matrix, and the publish jobs silently never ran
      # while this step reported success.
      - id: matrix
        run: |
          targets=$(node scripts/platform-package.mjs matrix)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  # A draft's assets are invisible to a read-only token, so they are fetched here, in a job that
  # needs write to download and not to write, as build.yml's `verify-lambda-layer` does. Kept
  # apart from the publish jobs so that those, which install dependencies and hold the npm
  # identity, never hold write access to the repository. Each binary is checked against the hash
  # package.json records for it when its package is built, not here.
  assets:
    name: Fetch the release's binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the binaries off the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=npm-v$(node -p "require('./package.json').version")
          gh release download "$TAG" -R l7aromeo/meo-skia-canvas -p '*.gz' -p '*.gz.notices.md' -D "$RUNNER_TEMP/release"
          ls -l "$RUNNER_TEMP/release"

      # Kept for a week rather than a day: a target whose job fails is recovered by re-running
      # that job alone, which reads this run's artifact, and the whole workflow cannot be re-run
      # once any target has published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: ${{ matrix.target }}
    needs: [targets, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    strategy:
      # Stops the targets that have not started, which is all this can do: a publish that has
      # already returned cannot be withdrawn, and these run in parallel, so a failure part-way
      # leaves whatever succeeded on the registry at that version.
      #
      # What keeps that survivable is the order rather than this flag. Nothing references these
      # package names until the main package is published, and the main package pins them by
      # exact version -- so a partial set is invisible to every installer until "Publish to NPM"
      # runs, and the recovery is to publish the missing targets at the same version, which is
      # still free because they never published. `fail-fast` only keeps the set small enough to
      # be worth finishing rather than abandoning.
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The npm bundled with Node LTS can predate OIDC support, in which case publishing falls
      # back to looking for a token and fails.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release

      - name: Stage ${{ matrix.target }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          node scripts/platform-package.mjs build "${{ matrix.target }}" "$RUNNER_TEMP/staging" "$RUNNER_TEMP/release"

      # Same reasoning as the main package: npm tags every publish `latest` unless told
      # otherwise, so a prerelease would become the default resolution for these too.
      - name: Choose the dist-tag
        id: disttag
        run: |
          V=$(node -p "require('./package.json').version")
          case "$V" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing $V to dist-tag $TAG"

      # No token: each package authenticates through OIDC, so every one of them needs its own
      # Trusted Publisher registered on npmjs.com against this repository and workflow.
      #
      # Split rather than branched inside one step, so the step list itself says which ran.
      - name: Publish ${{ matrix.target }}
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ runner.temp }}/staging/meo-skia-canvas-${{ matrix.target }}
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}

      # The staging step above already expanded the binary and checked it against the recorded
      # hash, so this confirms the package the target would publish is well-formed. It contacts
      # no registry, so it cannot tell you the version is already taken.
      - name: Dry run only — ${{ matrix.target }} not published
        if: ${{ inputs.dry_run }}
        working-directory: ${{ runner.temp }}/staging/meo-skia-canvas-${{ matrix.target }}
        run: npm publish --dry-run --access public
