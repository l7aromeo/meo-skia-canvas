version: 2

updates:
  # Actions are pinned to commit SHAs, so a moved tag cannot run new code in workflows that can
  # publish to npm and crates.io. That makes them immutable but also frozen: these updates are the
  # only thing that advances them, and they rewrite both the SHA and its trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: node
    groups:
      dev-dependencies:
        dependency-type: development

  # skia-safe is deliberately excluded: bumping it changes the pinned Skia milestone, which is a
  # minor-version event for this crate and needs the binaries rebuilt and re-snapshotted, not a
  # dependency bump that CI can wave through.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: rust
    ignore:
      - dependency-name: skia-safe
    groups:
      cargo:
        patterns: ["*"]

  # The Linux build images are pinned by digest in build.yml, which is what makes a release
  # reproducible — and also what makes them go stale silently. This is the PR that says the image
  # moved. Only containers/ has Dockerfiles; the digest pin itself is updated by hand from the
  # summary containers.yml prints.
  - package-ecosystem: docker
    directory: /containers
    schedule:
      interval: weekly
    commit-message:
      prefix: containers
