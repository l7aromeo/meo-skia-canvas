version: 2

updates:
  # Actions are pinned to commit SHAs, so a moved tag cannot run new code in workflows that can
  # publish to npm and crates.io. That makes them immutable but also frozen: these updates are the
  # only thing that advances them, and they rewrite both the SHA and its trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # No JavaScript ecosystem is listed, and that is deliberate rather than an
  # oversight. `bun.lock` is written at `lockfileVersion` 2, which Bun has
  # produced since 1.4; Dependabot's updater image bakes in Bun 1.3.5, which
  # reads up to version 1, and the job fails with
  # `Dependabot::DependencyFileNotSupported`. That failure is the good outcome:
  # before dependabot-core#15896 the old Bun silently discarded the lockfile,
  # resolved from scratch and wrote a version 1 file back.
  #
  # There is no setting that avoids it. `packageManager` does not choose the
  # updater's Bun, the lockfile version is not configurable here, and a
  # self-hosted runner pulls the same image. The only repository-side lever is
  # holding Bun at 1.3.x, which is the tool dictating the toolchain.
  #
  # So the entries are absent until the updater ships a Bun that reads what Bun
  # writes -- dependabot/dependabot-core#15848. Restoring them is one block per
  # lockfile, and there are three: `package-ecosystem: bun` at `/` grouped by
  # `dependency-type: development`, and one each at `/scripts/typedoc` and
  # `/scripts/api-surface` grouped `patterns: ["*"]` -- both of those pin their
  # own TypeScript because the root has none with a compiler API. Until then
  # the JavaScript dependencies are updated by hand with `bun update`; they are
  # development-only and do not reach the published package.

  # skia-safe is deliberately excluded: bumping it changes the pinned Skia milestone, which is a
  # minor-version event for this crate and needs the binaries rebuilt and re-snapshotted, not a
  # dependency bump that CI can wave through.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: rust
    ignore:
      - dependency-name: skia-safe
    groups:
      cargo:
        patterns: ["*"]

  # The Linux build images are pinned by digest in build.yml, which is what makes a release
  # reproducible — and also what makes them go stale silently. This is the PR that says the image
  # moved. Only containers/ has Dockerfiles; the digest pin itself is updated by hand from the
  # summary containers.yml prints.
  - package-ecosystem: docker
    directory: /containers
    schedule:
      interval: weekly
    commit-message:
      prefix: containers
