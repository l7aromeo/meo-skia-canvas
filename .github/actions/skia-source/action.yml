name: Skia source
description: >-
  Restore the patched Skia tree the skia-source job saved for this runner's
  platform, name it with `node scripts/skia-source.mjs prepare`, and export it
  as SKIA_SOURCE_DIR, so skia-bindings builds offline from it.
outputs:
  # The tree's cache key, `skia-source-<platform>-<tree>`. A job's Rust cache
  # carries it in its own key: skia-bindings rebuilds Skia whenever
  # SKIA_SOURCE_DIR names another tree, and rust-cache never saves over a
  # key it already has, so a Rust cache keyed without the tree kept a Skia
  # built from a superseded one and every job compiled Skia again.
  key:
    description: The tree's cache key, `skia-source-<platform>-<tree>`.
    value: ${{ steps.skia-key.outputs.key }}
runs:
  using: composite
  steps:
    # The key is the one the skia-source job saves under: the tree's name for
    # this runner's platform, from scripts/skia-source.mjs, which carries the
    # version and the patches' digest. macOS's matches build.yml's, so the
    # clippy legs and the release build share one cache.
    - name: Name the Skia source's cache key
      id: skia-key
      shell: bash
      run: |
        key=$(node scripts/skia-source.mjs cache-key)
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Restore the Skia source
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/meo-skia-canvas
        key: ${{ steps.skia-key.outputs.key }}
    # The directory is taken by an assignment of its own before it is
    # written out. Inside echo's arguments a failing `prepare` did not fail
    # the step -- `bash -e` does not see a command substitution's status
    # there -- so a fetch that failed wrote an empty `SKIA_SOURCE_DIR`, and
    # skia-bindings read that as an offline build from no directory and died
    # reporting gn missing. An assignment carries the status.
    - name: Prepare the Skia source
      shell: bash
      run: |
        dir=$(node scripts/skia-source.mjs prepare)
        echo "SKIA_SOURCE_DIR=$dir" >> "$GITHUB_ENV"
