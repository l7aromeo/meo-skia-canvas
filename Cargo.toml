[package]
name = "skia-canvas"
version = "0.2.0"
description = "GPU-accelerated, multi-threaded HTML Canvas-compatible 2D rendering for Rust and Node, powered by Skia."
authors = [
    "Christian Swinehart <drafting@samizdat.co>",
    "Moritz Moeller <virtualritz@protonmail.com>",
]
license = "MIT"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/phyrondev/phyron-skia-canvas"
homepage = "https://github.com/phyrondev/phyron-skia-canvas"
documentation = "https://docs.rs/skia-canvas"
readme = "README.md"
keywords = ["canvas", "skia", "graphics", "gpu", "rendering"]
categories = ["graphics", "rendering", "multimedia::images"]
include = [
    "/src/**/*.rs",
    "/src/bdf_stub.c",
    "/Cargo.toml",
    "/build.rs",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/docs/api/native-rust.md",
    "/tests/native_api_contract.rs",
    "/examples/**/*.rs",
]

[lib]
# Build both a C dynamic library (for the Node/Neon addon that
# `napi-rs`-style consumers dlopen) and a regular Rust rlib so
# downstream Rust crates can depend on the pure-Rust types directly.
# The Neon-specific `#[neon::main]` entry point is feature-gated
# below so Rust-only consumers opt out of the Node addon registration.
crate-type = ["cdylib", "rlib"]

[features]
# Default to the lean Rust library surface. Enable `node-addon` to
# build the cdylib as a Node.js addon (registers `#[neon::main]`).
default = []

# Registers the Neon `#[neon::main]` entry point and the export
# table that Node.js consults when dlopen'ing the resulting cdylib.
node-addon = []

freetype = ["skia-safe/embed-freetype", "skia-safe/freetype-woff2"]
metal = [
    "skia-safe/metal",
    "dep:metal",
    "dep:raw-window-handle",
    "dep:raw-window-metal",
    "dep:core-graphics-types",
    "dep:cocoa",
    "dep:objc",
]
vulkan = ["skia-safe/vulkan", "winit/rwh_05", "dep:ash", "dep:vulkano"]
window = ["dep:winit", "dep:spin_sleep"]

[package.metadata.docs.rs]
# The documented surface is the `native` facade; the Neon binding modules
# are `#[doc(hidden)]`. `native` has no feature-gated public items, so docs
# build with no extra features. Our base skia-safe features
# (textlayout/webp/svg) are all present in the upstream `bindings_docs.rs`
# stub, so docs.rs compiles against the stub with no Skia build. Enabling
# vulkan/window/freetype would only pull in skia-safe symbols absent from
# the stub while adding nothing visible to the docs.
no-default-features = true

[dependencies]
allsorts = { version = "0.17", features = [
    "flate2_zlib",
], default-features = false }

# vulkan
ash = { version = "0.38", optional = true }
cocoa = { version = "0.26", optional = true }
core-graphics-types = { version = "0.2", optional = true }
crc = "3"
crossbeam = "0.8"
css-color = "0.2"
dashmap = "6"
little_exif = "0.6"

# metal
metal = { version = "0.33", optional = true }
neon = "1"
objc = { version = "0.2", optional = true }
once_cell = "1"
parking_lot = "0.12"
process_path = "0.1"
raw-window-handle = { version = "0.6", optional = true }
raw-window-metal = { version = "1", optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 0.97.2 is the first release whose tarball ships `bindings_docs.rs`, so
# it's the floor that lets docs.rs build (rust-skia/rust-skia#1286).
skia-safe = { version = "0.97.2", features = ["textlayout", "webp", "svg"] }
spin_sleep = { version = "1", optional = true }
vulkano = { version = "0.35", optional = true }

# windowing
winit = { version = "0.30", features = ["serde"], optional = true }

[dev-dependencies]
anyhow = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
# The `objc` crate's `msg_send!` macro (used by the Metal backend) emits
# an old-style `cfg(feature = "cargo-clippy")`. It expands in our crate,
# so it's checked against our features and would trip `unexpected_cfgs`
# under `-D warnings`. Declare it expected rather than chase an `objc`
# bump through the `cocoa`/`metal` stack.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
