[package]
name = "meo-skia-canvas"
version = "0.13.0"
description = "A multi-threaded, GPU-accelerated 2D graphics environment for Rust and Node: the HTML Canvas API on Skia, with GUI windows, animation, and export to raster and vector formats."
authors = [
    "Christian Swinehart <drafting@samizdat.co>",
    "Moritz Moeller <virtualritz@protonmail.com>",
    "L A Romeo <ukasyahrz@outlook.com>",
]
license = "MIT"
edition = "2024"
# Edition 2024 on its own would allow 1.85, which is what this said until it was
# checked against a real toolchain: the crate uses let-chains in 33 places and
# those stabilized in 1.88.
#
# 1.90 is what the graph now asks for, not the source: `quantette` and
# `ordered-float` both declare it, so dropping either one leaves the floor
# where it is. Quantette is the palette quantizer the GIF encoder needs, and
# the alternative -- `color_quant`, which builds on 1.56 -- is NeuQuant, a 1994
# neural quantizer whose palettes are visibly worse on gradients and flat
# colour alike. The format would have shipped either way; the pictures would
# not have.
rust-version = "1.90"
repository = "https://github.com/l7aromeo/meo-skia-canvas"
homepage = "https://github.com/l7aromeo/meo-skia-canvas"
documentation = "https://docs.rs/meo-skia-canvas"
readme = "README.md"
keywords = ["canvas", "skia", "graphics", "gpu", "rendering"]
categories = ["graphics", "rendering", "multimedia::images"]
# Every example is declared by hand further down. Cargo would otherwise pick
# up `examples/*.rs`, which is the flat layout this tree deliberately does not
# use.
autoexamples = false
include = [
    "/src/**/*.rs",
    "/src/bdf_stub.c",
    "/Cargo.toml",
    "/build.rs",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/docs/rust.md",
    "/tests/native_api_contract.rs",
    # The only two fixtures that test reads. Shipping the test without them made
    # `cargo test` fail on a vendored copy for three cases that cannot open their
    # input; the rest of tests/assets is 1.6 MB and no packaged test touches it.
    "/tests/assets/images/pentagon.png",
    "/tests/assets/fonts/Oswald/Oswald-VariableFont_wght.ttf",
    "/examples/**/*.rs",
]

[lib]
# Build both a C dynamic library (for the Node/Neon addon that
# `napi-rs`-style consumers dlopen) and a regular Rust rlib so
# downstream Rust crates can depend on the pure-Rust types directly.
# The Neon-specific `#[neon::main]` entry point is feature-gated
# below so Rust-only consumers opt out of the Node addon registration.
crate-type = ["cdylib", "rlib"]

[features]
# Default to the lean Rust library surface. Enable `node-addon` to
# build the cdylib as a Node.js addon (registers `#[neon::main]`).
default = []

# Registers the Neon `#[neon::main]` entry point and the export
# table that Node.js consults when dlopen'ing the resulting cdylib.
node-addon = []

freetype = ["skia-safe/embed-freetype", "skia-safe/freetype-woff2"]
metal = [
    "skia-safe/ganesh",
    "skia-safe/metal",
    "dep:raw-window-handle",
    "dep:raw-window-metal",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
]
vulkan = ["skia-safe/ganesh", "skia-safe/vulkan", "winit/rwh_05", "dep:ash", "dep:vulkano"]
window = ["dep:winit", "dep:spin_sleep"]

[package.metadata.docs.rs]
# The documented surface is the crate-root modules re-exported through
# `prelude`, plus `gui`; the Neon binding modules are `pub(crate)`, so
# rustdoc never reaches them. Our base skia-safe features
# (textlayout/webp/svg) are all present in the upstream `bindings_docs.rs`
# stub, so docs.rs compiles against the stub with no Skia build.
#
# `window` is here because `gui` is otherwise absent from the published
# docs entirely -- it is feature-gated, and nothing enabled it. `vulkan`
# comes along because `gui` needs a `Renderer`, which only exists behind a
# GPU backend; `window` on its own fails to document. Neither adds a public
# item of its own: `gpu` is `pub(crate)`, so the only visible effect is that
# `gui` renders.
#
# Verified under `DOCS_RS=1`, which is what makes skia-bindings use the
# stub: this set documents clean with zero warnings and `gui/index.html`
# present. `freetype` is deliberately not here -- it changes font loading,
# not the documented surface.
no-default-features = true
features = ["vulkan", "window"]

[lints.clippy]
# The options structs are built with `..Type::default()` even where every
# field is listed: the rest pattern is what keeps a caller compiling when a
# field is added, which `docs/rust.md` states as the contract.
# Clippy reads an exhaustive literal's `..` as dead weight; here it is the
# forward-compatible form.
needless_update = "allow"

# The examples are split by language -- `examples/rust` beside
# `examples/node` -- so neither surface looks like the afterthought. Cargo
# only auto-discovers `examples/*.rs`, so every one is declared here instead;
# `autoexamples = false` above makes that a rule rather than a coincidence, so
# a file dropped into the tree is not silently built as something it is not.
[[example]]
name = "animated_eye"
path = "examples/rust/animated_eye.rs"

[[example]]
name = "basic_render"
path = "examples/rust/basic_render.rs"

[[example]]
name = "benchmark"
path = "examples/rust/benchmark.rs"

[[example]]
name = "feature_sheet"
path = "examples/rust/feature_sheet.rs"

[[example]]
name = "report_card"
path = "examples/rust/report_card.rs"

# Needs a window and a GPU backend to build at all, so it is gated rather than
# compiled by every `cargo test`. `window` alone is not sufficient -- `gui`
# needs a `Renderer` -- but required-features cannot vary by platform, and
# naming a backend here would pick the wrong one on two thirds of them. The
# example's own header gives the full command.
[[example]]
name = "window"
path = "examples/rust/window.rs"
required-features = ["window"]

[dependencies]
allsorts = { version = "0.17", features = [
    "flate2_zlib",
], default-features = false }

# vulkan
ash = { version = "0.38", optional = true }
crc = "3"
csscolorparser = "0.8"
dashmap = "6"

# The formats Skia has no encoder for. Skia's encoder list is three modules
# -- JPEG, PNG and WebP -- so anything else is encoded here,
# from pixels Skia hands back. One focused crate per format rather than the
# `image` umbrella: `image` is a facade over these same crates and would pull
# in decoders for a dozen formats this crate already decodes through Skia.
gif = "0.14"
little_exif = "0.6"
# APNG as well as PNG. Skia cannot read an APNG either -- its Rust PNG decoder
# is compiled out of skia-safe 0.99 -- so this is both the encoder and the only
# thing that can check what it wrote.
png = "0.18"
# Already in the tree by way of `png`, so this adds no build. Used only to
# probe whether PNG row filtering pays for a given drawing -- see
# `png_filter_flags`.
flate2 = "1.1"
# Palette reduction for GIF, which is an indexed format and needs one.
# k-means in Oklab, against `color_quant`'s NeuQuant; `default-features` off
# because the defaults pull in the `image` umbrella this crate does without.
# Not a format library: pixels in, palette and indices out.
quantette = { version = "0.6", default-features = false, features = [
    "kmeans",
    "threads",
] }
# Multi-page TIFF. The one format here that earns a dependency: LZW and
# deflate predictors, and a directory of offsets that can only be filled in
# once the strips are written. BMP and ICO are headers wrapped around pixels
# this crate already has, and are written by hand -- `ico` would otherwise
# pull a second copy of `png` into the tree beside the one APNG uses.
tiff = "0.11"

neon = "1"

# metal -- versions match what skia-safe already pins, so the tree keeps one
# copy of each rather than gaining a second.
objc2 = { version = "0.6", optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-quartz-core = { version = "0.3", features = [
    "CAMetalLayer",
], optional = true }
parking_lot = "0.12"
process_path = "0.1"
raw-window-handle = { version = "0.6", optional = true }
raw-window-metal = { version = "1", optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 0.97.2 is the first release whose tarball ships `bindings_docs.rs`, so
# it's the floor that lets docs.rs build (rust-skia/rust-skia#1286).
skia-safe = { version = "0.153.2", features = ["textlayout", "webp", "svg"] }
spin_sleep = { version = "1", optional = true }
vulkano = { version = "0.35", optional = true }

# windowing
winit = { version = "0.30", features = ["serde"], optional = true }
avif-serialize = "0.8"
# The AV1 decoder AVIF is built on, bound directly in `src/decode/aom.rs`.
# `aom-decode` wrapped this and was used until its `avif` feature turned out
# not to be optional -- the feature guards a `quick_error!` variant naming
# `avif_parse`, and that macro drops the `#[cfg]`, so the crate does not
# compile with `default-features = false`. `avif-parse` is MPL-2.0, which
# `just licenses` refuses, and with the container parsed in `src/decode/avif.rs`
# the only thing wanted from that crate was the decoder handle. This is the
# same library it wrapped, one layer down and BSD-2 throughout.
libaom-sys = { version = "0.17.2", features = [
    "av1_decoder",
    "av1_encoder",
] }

[dev-dependencies]
anyhow = "1"
# Rewriting a chunk's payload means rewriting its checksum, and the APNG
# tests build files whose headers disagree with their contents on purpose.
# Already in the tree by way of `png` and `flate2`, so this adds no build.
crc32fast = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

