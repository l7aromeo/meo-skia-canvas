[package]
name = "meo-skia-canvas"
version = "0.4.0"
description = "GPU-accelerated, multi-threaded HTML Canvas-compatible 2D rendering for Rust and Node, powered by Skia."
authors = [
    "Christian Swinehart <drafting@samizdat.co>",
    "Moritz Moeller <virtualritz@protonmail.com>",
    "L A Romeo <ukasyahrz@outlook.com>",
]
license = "MIT"
edition = "2024"
# Edition 2024 on its own would allow 1.85, which is what this said until it was
# checked against a real toolchain: the crate uses let-chains in 33 places and
# those stabilized in 1.88. No dependency in the graph asks for more.
rust-version = "1.88"
repository = "https://github.com/l7aromeo/meo-skia-canvas"
homepage = "https://github.com/l7aromeo/meo-skia-canvas"
documentation = "https://docs.rs/meo-skia-canvas"
readme = "README.md"
keywords = ["canvas", "skia", "graphics", "gpu", "rendering"]
categories = ["graphics", "rendering", "multimedia::images"]
include = [
    "/src/**/*.rs",
    "/src/bdf_stub.c",
    "/Cargo.toml",
    "/build.rs",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/docs/api/native-rust.md",
    "/tests/native_api_contract.rs",
    # The only two fixtures that test reads. Shipping the test without them made
    # `cargo test` fail on a vendored copy for three cases that cannot open their
    # input; the rest of tests/assets is 5 MB and no packaged test touches it.
    "/tests/assets/pentagon.png",
    "/tests/assets/Oswald/Oswald-VariableFont_wght.ttf",
    "/examples/**/*.rs",
]

[lib]
# Build both a C dynamic library (for the Node/Neon addon that
# `napi-rs`-style consumers dlopen) and a regular Rust rlib so
# downstream Rust crates can depend on the pure-Rust types directly.
# The Neon-specific `#[neon::main]` entry point is feature-gated
# below so Rust-only consumers opt out of the Node addon registration.
crate-type = ["cdylib", "rlib"]

[features]
# Default to the lean Rust library surface. Enable `node-addon` to
# build the cdylib as a Node.js addon (registers `#[neon::main]`).
default = []

# Registers the Neon `#[neon::main]` entry point and the export
# table that Node.js consults when dlopen'ing the resulting cdylib.
node-addon = []

freetype = ["skia-safe/embed-freetype", "skia-safe/freetype-woff2"]
metal = [
    "skia-safe/metal",
    "dep:raw-window-handle",
    "dep:raw-window-metal",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
]
vulkan = ["skia-safe/vulkan", "winit/rwh_05", "dep:ash", "dep:vulkano"]
window = ["dep:winit", "dep:spin_sleep"]

[package.metadata.docs.rs]
# The documented surface is the crate-root modules re-exported through
# `prelude`, plus `gui`; the Neon binding modules are `pub(crate)`, so
# rustdoc never reaches them. Our base skia-safe features
# (textlayout/webp/svg) are all present in the upstream `bindings_docs.rs`
# stub, so docs.rs compiles against the stub with no Skia build.
#
# `window` is here because `gui` is otherwise absent from the published
# docs entirely -- it is feature-gated, and nothing enabled it. `vulkan`
# comes along because `gui` needs a `Renderer`, which only exists behind a
# GPU backend; `window` on its own fails to document. Neither adds a public
# item of its own: `gpu` is `pub(crate)`, so the only visible effect is that
# `gui` renders.
#
# Verified under `DOCS_RS=1`, which is what makes skia-bindings use the
# stub: this set documents clean with zero warnings and `gui/index.html`
# present. `freetype` is deliberately not here -- it changes font loading,
# not the documented surface.
no-default-features = true
features = ["vulkan", "window"]

[lints.clippy]
# The options structs are built with `..Type::default()` even where every
# field is listed: the rest pattern is what keeps a caller compiling when a
# field is added, which `docs/api/native-rust.md` states as the contract.
# Clippy reads an exhaustive literal's `..` as dead weight; here it is the
# forward-compatible form.
needless_update = "allow"

# Needs a window and a GPU backend to build at all, so it is gated rather than
# compiled by every `cargo test`. `window` alone is not sufficient -- `gui`
# needs a `Renderer` -- but required-features cannot vary by platform, and
# naming a backend here would pick the wrong one on two thirds of them. The
# example's own header gives the full command.
[[example]]
name = "window"
required-features = ["window"]

[dependencies]
allsorts = { version = "0.17", features = [
    "flate2_zlib",
], default-features = false }

# vulkan
ash = { version = "0.38", optional = true }
crc = "3"
crossbeam = "0.8"
csscolorparser = "0.8"
dashmap = "6"
little_exif = "0.6"

neon = "1"

# metal -- versions match what skia-safe already pins, so the tree keeps one
# copy of each rather than gaining a second.
objc2 = { version = "0.6", optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-quartz-core = { version = "0.3", features = [
    "CAMetalLayer",
], optional = true }
once_cell = "1"
parking_lot = "0.12"
process_path = "0.1"
raw-window-handle = { version = "0.6", optional = true }
raw-window-metal = { version = "1", optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 0.97.2 is the first release whose tarball ships `bindings_docs.rs`, so
# it's the floor that lets docs.rs build (rust-skia/rust-skia#1286).
skia-safe = { version = "0.99.0", features = ["textlayout", "webp", "svg"] }
spin_sleep = { version = "1", optional = true }
vulkano = { version = "0.35", optional = true }

# windowing
winit = { version = "0.30", features = ["serde"], optional = true }

[dev-dependencies]
anyhow = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

