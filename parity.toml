npm  = ["Window.new(options)"]
why  = """JavaScript builds a window from `new Window(width, height, options)`
       or `new Window(options)`, the options carrying title, background,
       fit, cursor and the rest. Rust builds it from `Window::new(width,
       height)` and sets each of those through its own setter --
       `Window::set_title`, `Window::set_background`, `Window::set_fit`,
       `Window::set_cursor`. The settings are the same; one surface takes
       them together and the other one at a time."""
