[[capability]]
name = "npm's abbreviated spellings of a blend operator"
rust = []
npm  = ["BlendMode.dst",
        "BlendMode.dst-atop",
        "BlendMode.dst-in",
        "BlendMode.dst-out",
        "BlendMode.dst-over",
        "BlendMode.dstATop",
        "BlendMode.dstIn",
        "BlendMode.dstOut",
        "BlendMode.dstOver",
        "BlendMode.source",
        "BlendMode.src-atop",
        "BlendMode.src-in",
        "BlendMode.src-out",
        "BlendMode.src-over",
        "BlendMode.srcATop",
        "BlendMode.srcIn",
        "BlendMode.srcOut",
        "BlendMode.srcOver"]
why  = "Eighteen extra ways to write operators that already pair under another
       spelling: Skia's src and dst abbreviations beside the standard's source
       and destination. Every one of the eighteen names an operator Rust has,
       and none is a capability. This is the case check-parity.mjs:650
       describes and says no classifier can carry -- BlendMode spells one value
       srcOver, src-over AND source-over, so two of the three land in
       `unregistered` looking like something the crate lacks -- and it names
       the manifest as the protection. This is that entry.
       Not reachable by member alias: `member_aliases` is single-valued, so
       BlendMode.SourceOver can be given srcOver or src-over and not both, and
       the third spelling would land here regardless.
       THE OTHER 29 npm IDS OF THIS CAPABILITY ARE NOT HERE, on the assumption
       that the blend alias in aliases-A2.json is accepted. If it is refused,
       or if owner_aliases is not made surface-keyed, take the block from this
       file's header instead."

