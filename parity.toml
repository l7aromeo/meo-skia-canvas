[[capability]]
name = "npm-side conveniences over a value that already pairs"
rust = []
npm = ["Canvas.contexts",
       "ImageData.bytesPerPixel",
       "Image.currentColor",
       "WindowOptions.canvas"]
why = """Four npm members with no Rust counterpart, each derivable from or
      adjacent to something that pairs. `contexts` is a static `WeakMap`
      registry keyed by canvas -- rejected as an alias for `Canvas::context`,
      which is an instance accessor. `bytesPerPixel` is `stride` divided by
      width. `currentColor` is the SVG paint-inheritance colour, which the
      crate takes when rasterising rather than storing on the image. `canvas`
      is the surface a window draws on rather than an option about the window
      -- the residue named when `WindowSpec -> WindowOptions` was measured."""
status = "deliberate"

[[capability]]
name = "registering several font files, or one under its own family name"
rust = []
npm = ["FontLibrary.use"]
why = """`FontLibrary.use` registers a font from a path or a buffer, which the
      crate's `register_font_from_path` and `register_font_from_data` do one
      file at a time, and also several files under one family, several
      families from one object, and a file under the family name the font
      itself declares, returning the details of what it registered. The crate
      takes one file per call, always needs the family name from the caller
      and returns nothing, so a Rust caller registering a font under its own
      name has to know that name first. A gap in the crate."""
status = "gap"
issue = "unfiled"

