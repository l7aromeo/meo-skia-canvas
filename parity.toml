[[capability]]
name = "inline placeholders in a paragraph"
rust = ["Placeholder"]
npm  = []
why  = "npm carries these as the parameters of
       `addPlaceholder(width, height, align, baseline, offset)` at
       `lib/classes/typography.js:178`, declared at `lib/index.d.ts:5367`, with
       `PlaceholderAlignment` supplying the alignment values. The mapping is
       one-to-one: `width`, `height`, `alignment` to `align`, `baseline`, and
       `baseline_offset` to `offset`. The npm extractor emits declarations and not
       parameters, so none of those five has an id to pair with. This entry exists
       because of that limitation and should be deleted when both extractors emit
       parameters -- it is not a statement that npm lacks the capability."

