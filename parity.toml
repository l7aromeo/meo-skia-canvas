[[capability]]
name = "whether a strut applies, as a flag and as an option"
rust = []
npm  = ["StrutStyleInput.enabled"]
why = """The crate carries the same state without a field for it:
      `TextStyle.strut` is `Option<StrutStyle>`, so a strut is enabled by being
      present, and `build_paragraph_style` in src/text.rs sets
      `sk_strut.set_strut_enabled(true)` unconditionally whenever one is attached.
      npm needs the explicit key because its options object always exists -- there is
      no `Option` to be `None`. So `enabled: false` and Rust's `strut: None` are the
      same state, and `enabled` has no Rust member to pair with because Rust encodes
      it in the shape rather than in a field."""
status = "deliberate"

