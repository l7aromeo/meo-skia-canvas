[[capability]]
name = "the `prototype` property on declared classes"
rust = []
npm  = ["CanvasGradient.prototype",
        "CanvasRenderingContext2D.prototype",
        "DOMMatrix.prototype",
        "DOMPoint.prototype",
        "DOMRect.prototype",
        "Path2D.prototype",
        "TextMetrics.prototype"]
why  = "Not a capability on either side. These are `declare class` artefacts
       in lib/index.d.ts -- every JavaScript constructor has a `prototype`,
       and declaring it explicitly adds nothing a caller can use. One of the
       same kind was deleted from `ImageData` earlier for this reason. The
       entry is here so the gate is quiet; the better fix is to stop
       declaring them, which is the binding lane's call."


[[capability]]
name = "window construction options against the live window"
rust = ["WindowSpec", "WindowSpec.background", "WindowSpec.borderless",
        "WindowSpec.cursor", "WindowSpec.fit", "WindowSpec.fullscreen",
        "WindowSpec.height", "WindowSpec.id", "WindowSpec.left",
        "WindowSpec.page", "WindowSpec.resizable", "WindowSpec.text_contrast",
        "WindowSpec.text_gamma", "WindowSpec.title", "WindowSpec.top",
        "WindowSpec.visible", "WindowSpec.width"]
npm  = []
why  = "`WindowSpec` is the options a caller passes to open a window; Rust
        `Window` is the window that results and declares the same names as
        live properties. npm has one `Window`, whose constructor takes the
        options object, so the two Rust types answer to one npm type and an
        owner alias cannot say that. It was proposed as one and refused by
        measurement: `WindowSpec -> Window` produced 43 collisions, every one
        of them `Window::x` and `WindowSpec.x` claiming `Window.x`."

[[capability]]
name = "a shadow offset as one member or two"
rust = ["TextShadow.offset_x", "TextShadow.offset_y"]
npm  = ["TextShadowInput.offset"]
why  = "One capability counted differently: npm carries a single `offset`
        where Rust carries `offset_x` and `offset_y`. A member alias cannot
        express it -- aliasing both makes them claim one name, which the
        collision check refuses, correctly, since an alias asserts one
        capability spelled two ways rather than two members answering one."

