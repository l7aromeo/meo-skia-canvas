        "BackendInfo.renderer.GPU",
        "TextStyleInput.fontStyle.slant"]
why = """Ids of the form `Holder.member.value` -- a union or object written
      inline on a property rather than as a named type. Rust carries the same values
      in named holders instead: the backend api and renderer are fields typed by
      enums the crate names, and `fontStyle`'s three keys are `TextStyle`'s
      `slant`, `font_weight` and `stretch` as flat fields.
      No alias can express these, because one side's holder is a type and the
      other's is a member path -- `ChromaSampling` against
      `ExportOptions.chromaSampling` is the same shape. They are registered
      rather than paired because the mapping has no form for a member-path
      holder, and that is a decision about the mapping rather than an absence in
      either surface."""
