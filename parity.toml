[[capability]]
name = "rectangle geometry"
rust = ["Rect"]
npm  = ["DOMRect", "Path2DBounds"]
why  = "One Rust type answers to two npm ones. `Rect as DOMRect` is declared
       at src/lib.rs:353, and `Rect` is also what `Path2D::bounds` returns,
       which npm declares separately as `Path2DBounds` -- six of its six
       members are Rust `Rect` members. An owner alias maps one holder to
       one holder and cannot express that, which is why this is an entry."


[[capability]]
name = "matrix initialiser dictionaries"
rust = []
npm  = ["DOMMatrixInit", "DOMMatrix2DInit"]
why  = "WebIDL init dictionaries: the shape a JavaScript caller passes to
       build a matrix, spelled as a type because JavaScript has no other way
       to name an argument list. Rust takes `Affine` itself, so the
       capability is `Affine` and these are its call syntax."

[[capability]]
name = "point and rect initialiser dictionaries"
rust = []
npm  = ["DOMPointInit", "DOMRectInit"]
why  = "The same WebIDL argument-shape convention as the matrix dictionaries
       above. Rust takes `Point` and `Rect` directly."

[[capability]]
name = "the readonly halves of the DOM geometry types"
rust = []
npm  = ["DOMPointReadOnly", "DOMPointReadOnly.matrixTransform",
        "DOMPointReadOnly.toJSON", "DOMPointReadOnly.w",
        "DOMPointReadOnly.z", "DOMRectReadOnly",
        "DOMRectReadOnly.toJSON", "DOMRectReadOnly.x",
        "DOMRectReadOnly.y"]
why  = "WebIDL splits each geometry type into a readonly base and a mutable
       subclass so the platform can hand out an immutable view. Rust
       expresses that with `&` on the borrow rather than with a second type,
       so `Point` and `Rect` are both halves at once.
       The ids are named one by one rather than by holder, because these two
       holders are not fully unmapped: `DOMPoint extends DOMPointReadOnly`,
       so `x` and `y` reach Rust `Point` through the heritage closure and
       pair on their own. Only the members with no Rust counterpart are
       listed -- the third and fourth coordinates, the two `toJSON`s and
       `matrixTransform`."


