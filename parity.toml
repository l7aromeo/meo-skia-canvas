[[capability]]
name = "projective transforms"
rust = ["Context2D::create_projection",
        "Context2D::set_projection",
        "Context2D::transform_projection",
        "Context2D::projection"]
npm = ["CanvasRenderingContext2D.createProjection",
       "CanvasTransform.setTransform",
       "CanvasTransform.transform",
       "CanvasRenderingContext2D.currentTransform"]
why = "Both surfaces have the whole capability; only the shape differs, and the
      crate's own doc comment at src/context2d.rs:1753 says why: 'This is what the
      JavaScript side spells `ctx.transform(matrix)` -- there, one method takes both
      the affine and the projective case because both arrive as the same object.'
      Rust needs two methods because `Affine` carries six values and `Projection`
      nine; JavaScript needs one because a `DOMMatrix` carries either.
      The projective row survives the crossing on purpose. `affineSix` in
      lib/classes/context.js:83 refuses a matrix with `m14`, `m24` or `m44` set, so
      a projection skips the six-value fast path; `toSkMatrix` emits nine; and
      `to_matrix` in src/node/utils.rs:1583 has a nine-value arm. Measured: a
      canvas rect filled under `transform(createProjection(quad))` has rows 42 and
      58 wide where an affine transform gives 30 and 30.
      Named as four ids on each side rather than left unregistered because the gate
      reported them unpaired and that reads as a missing feature. It is the inverse
      of the failure recorded in GAPS-A.md: there an exception list silences a real
      gap, here a naming difference reads as a gap. Same root, opposite direction,
      and the cost here would have been a duplicated API -- `setProjection` and
      `transformProjection` added beside `setTransform` and `transform`, doing the
      same thing under a second name."



