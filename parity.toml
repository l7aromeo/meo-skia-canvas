[[capability]]
name = "projective transforms"
rust = ["Context2D::set_projection",
        "Context2D::transform_projection",
        "Context2D::projection"]
npm = ["CanvasRenderingContext2D.currentTransform"]
why = """Both surfaces have the whole capability; only the shape differs, and the
      crate's own doc comment on `Context2D::transform_projection` says why:
      'This is what the JavaScript side spells `ctx.transform(matrix)` -- there,
      one method takes both the affine and the projective case because both
      arrive as the same object.' Rust needs two methods because `Affine`
      carries six values and `Projection` nine; JavaScript needs one because a
      `DOMMatrix` carries either.
      The projective row survives the crossing on purpose. `affineSix` in
      lib/classes/context.js refuses a matrix with `m14`, `m24` or `m44` set, so
      a projection skips the six-value fast path; `toSkMatrix` emits nine; and
      `to_matrix` in src/node/utils.rs has a nine-value arm. Measured: a canvas
      rect filled under `transform(createProjection(quad))` has rows 42 and 58
      wide where an affine transform gives 30 and 30.
      Named as four ids on each side rather than left unregistered because the gate
      reported them unpaired and that reads as a missing feature. That is the
      inverse of an exception list silencing a real gap: here a naming
      difference reads as one, and the cost would have been a duplicated API --
      `setProjection` and `transformProjection` added beside `setTransform` and
      `transform`, doing the same thing under a second name."""



