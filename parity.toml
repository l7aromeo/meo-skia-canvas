        "BezierCurveTo.c1x", "BezierCurveTo.c1y", "BezierCurveTo.c2x",
        "BezierCurveTo.c2y", "BezierCurveTo.x", "BezierCurveTo.y",
        "ConicCurveTo.cx", "ConicCurveTo.cy", "ConicCurveTo.weight",
        "ConicCurveTo.x", "ConicCurveTo.y",
        "QuadraticCurveTo.cx", "QuadraticCurveTo.cy",
        "QuadraticCurveTo.x", "QuadraticCurveTo.y"]
npm  = ["Path2D"]
why  = "npm builds a path by calling methods on `Path2D` and reads it back
       through its own `PathSegment`; the crate separates building
       (`PathBuilder`) from the built path, and names each segment shape as
       a struct. Same capability, two different shapes -- the segment
       structs are how Rust spells what a JavaScript caller writes as a
       tuple in a `PathSegment` union."


