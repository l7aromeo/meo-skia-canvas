[[capability]]
name = "path boolean operations"
rust = ["PathOp"]
npm = []
why = "JavaScript spells these as five methods on Path2D -- complement, difference,
      intersect, union and xor -- rather than as an enum passed to one method. The
      five names correspond exactly to the five Rust variants. An alias would be
      wrong here: a variant is not a method, and pairing them would assert a
      sameness the shapes do not have."

[[capability]]
name = "keyboard and mouse event payloads"
rust = ["Keyboard.code", "Keyboard.event", "Keyboard.key", "Keyboard.location", "Keyboard.modifiers", "Keyboard.repeat", "Mouse.button", "Mouse.buttons", "Mouse.event", "Mouse.modifiers", "Mouse.page_point", "Mouse.point", "UiEvent", "AppEvent"]
npm = ["KeyboardEventProps", "MouseEventProps", "WindowEvents"]
why = "Both sides carry the same events; the shapes differ. Rust models them as one
      `UiEvent` enum whose variants own payload structs (`Keyboard`, `Mouse`);
      JavaScript models them as a `WindowEvents` map from event name to a props
      object. Registered rather than aliased because the correspondence is
      one-enum-to-one-map, not holder-to-holder."

