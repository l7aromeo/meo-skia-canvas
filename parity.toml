rust = ["ImageData::from_url",
        "ImageData::from_pixels"]
npm  = ["loadImageData"]
why  = """`ImageData::from_url` is `loadImageData(url, width, height)` and reads
       `data:` URLs, and `ImageData::from_pixels` is the same given the bytes,
       read as pixels rather than decoded. Apart from the `Image` loaders
       because an entry offers every Rust function it names to every
       JavaScript one it names, and the parameter pass would otherwise hold
       `loadImage`'s encoded bytes to `from_pixels`, which takes raw ones."""

[[capability]]
name = "how a URL is requested"
rust = ["LoadOptions",
        "LoadOptions::new",
        "LoadOptions::header",
        "LoadOptions::redirect",
        "LoadOptions::integrity",
        "LoadOptions::timeout",
        "LoadOptions::cancel",
        "Redirect",
        "Redirect::Follow",
        "Redirect::Error",
        "Redirect::Manual",
        "Cancel",
        "Cancel::new",
        "Cancel::cancel",
        "Cancel::is_cancelled"]
npm  = []
why  = """npm's loaders take a `RequestInit`, which is TypeScript's own DOM type
       and not one this package declares, so no npm id carries it. Its
       `headers`, `redirect` and `integrity` are `LoadOptions::header`,
       `redirect` and `integrity`, and `Redirect` is `RequestRedirect`'s three
       values. `Cancel` is what `RequestInit.signal` does there: an aborted
       signal rejects a pending `loadImage` with an `AbortError`. A blocking
       Rust call cannot take an `AbortSignal`, so the token is cancelled from
       another thread instead. `timeout` has no npm counterpart and is what
       `AbortSignal.timeout()` gives a JavaScript caller."""
status = "deliberate"

